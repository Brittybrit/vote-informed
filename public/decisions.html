<style>

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55;}
  header{border-bottom:4px solid var(--rule); padding:18px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;}
  header a{color:var(--ink); text-decoration:none; font-weight:900; text-transform:uppercase; letter-spacing:.01em; font-size:20px;}
  .langs{display:flex; gap:6px;}
  .langs button{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; background:transparent; border:1.5px solid var(--rule); color:var(--ink); padding:5px 10px; cursor:pointer;}
  .langs button.on{background:var(--ink); color:var(--paper);}
  main{max-width:760px; margin:0 auto; padding:28px 16px 64px;}
  h1{font-weight:900; text-transform:uppercase; font-size:30px; line-height:1.1; margin-bottom:10px;}
  .lede{color:var(--ink-soft); margin-bottom:10px;}
  .bodies{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px;}
  .bodies span{font-family:var(--mono); font-size:11.5px; border:1.5px solid var(--ink); padding:3px 9px;}
  .bodies span.on{background:var(--ink); color:var(--paper);}
  .bodies span.soon{border-color:var(--hair); color:var(--ink-soft);}
  .stats{display:flex; flex-wrap:wrap; gap:8px 22px; font-family:var(--mono); font-size:12.5px; margin:14px 0 14px; padding:10px 0; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);}
  .stats b{font-family:var(--sans); font-size:20px; font-weight:900; display:block; line-height:1.1;}
  .ballot{font-size:14px; margin-bottom:14px;}
  .ballot div{margin-top:4px; padding-left:10px; border-left:4px solid var(--rule);}
  .ballot .muted{border-left-color:var(--hair); color:var(--ink-soft);}
  .tools{position:sticky; top:0; background:var(--paper); z-index:2; padding:10px 0 8px; border-bottom:2px solid var(--rule);}
  .tools input[type=search]{width:100%; font:inherit; font-size:15px; padding:9px 11px; border:1.5px solid var(--rule); background:#fff; color:var(--ink); border-radius:0;}
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .filters button{font-family:var(--mono); font-size:11.5px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); padding:3px 9px; cursor:pointer;}
  .filters button.on{background:var(--ink); color:var(--paper);}
  .act{padding:16px 0 18px; border-bottom:1px dotted var(--hair);}
  .when{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .ttl{font-weight:800; font-size:16px; line-height:1.35; margin-top:3px;}
  .party{font-size:14px; margin-top:3px;}
  .res{font-size:14px; margin-top:6px;}
  .res .split{color:var(--no-fg); font-weight:700;}
  .onb{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .onb span{font-family:var(--mono); font-size:11.5px; border:1.5px solid var(--ink); padding:1px 7px;}
  .onb span.no{border-color:var(--no-fg); color:var(--no-fg);}
  .onb span.away{border-style:dashed;}
  details{margin-top:7px; font-size:13.5px;}
  summary{cursor:pointer; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
  .roll{display:grid; grid-template-columns:1fr auto; gap:1px 12px; margin-top:5px; max-width:420px;}
  .roll .nb{color:var(--ink-soft);}
  .roll .v-no{color:var(--no-fg); font-weight:700;}
  .lobs, .gifts{font-size:13.5px; margin-top:9px; padding-left:10px;}
  .lobs{border-left:3px dotted var(--rule);}
  .gifts{border-left:3px solid var(--rule);}
  .h{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .lob, .gift{margin-top:3px;} .lob b, .gift b{font-weight:600;}
  .how2{font-size:12.5px; color:var(--ink-soft);}
  .nogift{font-size:13px; color:var(--ink-soft); margin-top:5px;}
  .note{font-size:13px; color:var(--ink-soft); margin-top:6px;}
  .links{font-family:var(--mono); font-size:11.5px; margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 14px;}
  a{color:var(--left-fg);}
  .empty, .noresult{color:var(--ink-soft); font-size:14px; margin-top:16px;}
  .how{margin-top:40px; padding-top:14px; border-top:2px solid var(--rule); font-size:14px; color:var(--ink-soft);}
  .how p{margin-bottom:10px;}
  footer{border-top:2px solid var(--rule); padding:18px 16px; font-size:14px; color:var(--ink-soft); text-align:center;}
  [hidden]{display:none !important;}
</style>

      how1: 'Kijan nou fè l: nou chèche chak dosye Komisyon Konte a te deside depi 18 novanm 2025 (lè komisè Lopez te chita) rive 6 oktòb 2026, pou jwenn yon konpayi prive, yon devlopè oswa yon gwoup ki gen non ki resevwa yon kontra, yon lokasyon, tè, yon apwobasyon zonaj, lajan oswa yon chanjman nan yon akò ki la deja. Nou pa mete dosye woutin ki pa gen yon benefisyè ki gen non. Chak vòt soti nan pwosè-vèbal Grefye Konsèy la, ki montre mosyon an, total la, chak vòt non ak chak absans, epi nou konpare l ak vòt ki nan rezolisyon siyen an lè grefye a pibliye l. Anpil pwosè-vèbal toujou make bouyon.',
      how2: 'Lobiyis yo se tout moun rejis lobiyis konte a montre pou konpayi a an 2025 oswa 2026, ak dat anrejistreman li ekri. Nou mare kado yo twa fason, epi chak kado di kilès: moun ki bay la se konpayi a menm; moun ki bay la gen menm non ak yon lobiyis anrejistre epi rapò a montre menm adrès la oswa yon travay lobi; oswa moun ki bay la se youn nan kat konpayi lobi (Bercow Radell Fernandez Larkin & Tapanes, Capital City Consulting, LSN Partners, Pantin Gov) nan menm adrès biwo ak yon lobiyis anrejistre sou dosye a. Nou ekri non yo jan chak dosye ekri yo. Nou verifye sèlman komisè ki sou bilten vòt 3 novanm lan: Vicki L. Lopez (kanpay konte li ak komite politik li prezide a) ak Oliver G. Gilbert III (kanpay federal li pou Kongrè). Li <a href="/methodology#ties">tout metòd la</a>. Ou jwenn yon erè? Ekri <a href="mailto:corrections@ballot305.org">corrections@ballot305.org</a>.',
      foot: '<a href="/">Retounen sou Ballot305.org</a> · <a href="/actions">Donatè, lobiyis ak aksyon ofisyèl pa kandida</a> · <a href="/methodology">Kijan li mache</a> · <a href="/about">Konsènan</a>'
    }
  };
  var LANG = 'en', DATA = null, F = 'all';
  try { var s0 = localStorage.getItem('ballot305.lang'); if (S[s0]) LANG = s0; } catch(e){}
  function t(k, v){ var s = (S[LANG][k] != null ? S[LANG][k] : S.en[k]) || ''; return v ? s.replace(/\{(\w+)\}/g, function(_, n){ return v[n] != null ? v[n] : ''; }) : s; }
  function esc(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function L(x){ return x && typeof x === 'object' ? (x[LANG] || x.en || '') : (x || ''); }
  function usd(n){ return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
  function day(d){ var m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ''; try { return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(LANG === 'ht' ? 'fr' : LANG, {month:'short', day:'numeric', year:'numeric'}); } catch(e){ return d; } }
  function link(u, txt){ return /^https:\/\//.test(u || '') ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(txt) + ' ↗</a>' : ''; }
  function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function list(a){ return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + (LANG === 'es' ? ' y ' : LANG === 'ht' ? ' ak ' : ' and ') + a[a.length - 1]; }

  function body(){ return DATA && DATA.bodies && DATA.bodies[0]; }
  function mem(B, k){ for(var i = 0; i < B.members.length; i++) if(B.members[i].key === k) return B.members[i]; return {name: k}; }
  function acctNames(B, keys){ return list(keys.map(function(k){ return L(B.accounts[k].name); })); }
  function vword(v){ return t('v.' + (v || 'vacant')); }
  function hasGift(a){ return (a.gifts || []).length > 0; }
  function isSplit(a){ return a.tally && a.tally[1] > 0; }

  function lobHtml(a){
    var ls = a.lobbied || [];
    if(!ls.length) return '';
    var by = {}, order = [];
    ls.forEach(function(l){ if(!by[l.for]){ by[l.for] = []; order.push(l.for); } by[l.for].push(l); });
    var rows = order.map(function(p){
      return by[p].map(function(l){ return '<div class="lob"><b>' + esc(l.name) + '</b>' + (order.length > 1 ? ' ' + t('lobFor', {p: esc(p)}) : '') + ' · ' + t('lobReg', {date: esc(day(l.reg))}) + '</div>'; }).join('');
    }).join('');
    var head = '<div class="h">' + t('lobbied') + (order.length === 1 ? ' (' + esc(order[0]) + ')' : '') + '</div>';
    if(ls.length > 6) return '<div class="lobs">' + head + '<details><summary>' + t('lobMore', {n: ls.length}) + '</summary>' + rows + '</details></div>';
    return '<div class="lobs">' + head + rows + '</div>';
  }
  function giftHtml(B, a){
    var on = Object.keys(B.onBallot), out = '';
    var gs = a.gifts || [];
    if(gs.length){
      out += '<div class="gifts"><div class="h">' + t('gifts') + '</div>' + gs.map(function(g){
        var basis = '';
        if(g.kind === 'lobbyist') basis = g.basis === 'addr' ? t('basisAddr') : t('basisOcc', {occ: esc(g.occ)});
        var how = g.kind === 'party' ? t('how.party') : t('how.' + g.kind, {lob: esc(g.lobbyist), p: esc(g.forParty), basis: basis});
        return '<div class="gift">' + t('gave', {donor: esc(g.donor), amt: usd(g.amount), date: esc(day(g.date)), acct: esc(L(B.accounts[g.acct].name))}) + '<div class="how2">' + how + '</div></div>';
      }).join('') + '</div>';
    }
    on.forEach(function(k){
      if(a.vacant === k) return;
      if(!gs.some(function(g){ return g.to === k; })) out += '<p class="nogift">' + t('noGift', {accts: esc(acctNames(B, B.onBallot[k].accounts))}) + '</p>';
    });
    return out;
  }
  function actHtml(B, a){
    var on = Object.keys(B.onBallot);
    var res = '<strong>' + t('res.' + a.result) + '</strong> ' + (a.tally[1] ? '<span class="split">' + t('tally', {y: a.tally[0], n: a.tally[1]}) + '</span>' : t('tally', {y: a.tally[0], n: 0}) + ', ' + t('unan'));
    var onb = on.map(function(k){ var v = a.roll[k]; return '<span class="' + (v === 'no' ? 'no' : v === 'yes' ? '' : 'away') + '">' + esc(t('votedBy', {name: mem(B, k).name, v: vword(v)})) + '</span>'; }).join('');
    var roll = B.members.map(function(m){
      var v = a.roll[m.key], ob = on.indexOf(m.key) >= 0;
      return '<span' + (ob ? '' : ' class="nb"') + '>' + (ob ? '<b>' + esc(m.name) + '</b>' : esc(m.name)) + '</span><span class="' + (v === 'no' ? 'v-no' : '') + '">' + vword(v) + '</span>';
    }).join('');
    var mv = a.mover && a.second ? '<div class="note">' + t('moved', {m: esc(mem(B, a.mover).name), s: esc(mem(B, a.second).name)}) + '</div>' : '';
    var party = (a.parties.length > 1 ? t('parties', {p: esc(a.parties.join('; '))}) : t('party', {p: esc(a.parties[0])}));
    var links = link(a.matterUrl, t('matter', {id: a.id})) + link(a.clerkUrl, t('clerk')) + link(a.minutesUrl, t('minutes') + (a.minutesStatus === 'draft' ? ' (' + t('draft') + ')' : '')) + ((a.lobbied || []).length ? link(B.registry.url, t('registry')) : '');
    var search = norm([a.id, a.ref, L(a.subject), a.parties.join(' ')].concat((a.lobbied || []).map(function(l){ return l.name; })).concat((a.gifts || []).map(function(g){ return g.donor; })).join(' '));
    return '<div class="act" data-search="' + esc(search) + '" data-gift="' + (hasGift(a) ? 1 : 0) + '" data-split="' + (isSplit(a) ? 1 : 0) + '" data-lob="' + ((a.lobbied || []).length ? 1 : 0) + '">' +
      '<div class="when">' + esc(day(a.date)) + ' · ' + t('meeting.' + a.meeting) + (a.ref ? ' · ' + esc(a.ref) : '') + '</div>' +
      '<div class="ttl">' + t('kind.' + a.kind) + ': ' + esc(L(a.subject)) + '</div>' +
      '<div class="party">' + party + '</div>' +
      '<div class="res">' + res + '</div>' +
      '<div class="onb">' + onb + '</div>' +
      '<details><summary>' + t('allVotes') + '</summary><div class="roll">' + roll + '</div><div class="note">' + t('grayNote') + '</div>' + mv + '</details>' +
      (a.note ? '<p class="note">' + esc(L(a.note)) + '</p>' : '') +
      lobHtml(a) + giftHtml(B, a) +
      '<div class="links">' + links + '</div></div>';
  }

  function render(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang') === LANG); });
    var q = document.getElementById('q'); q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
    document.getElementById('how').innerHTML = '<p>' + esc(t('how1')) + '</p><p>' + t('how2') + '</p>';
    document.getElementById('foot').innerHTML = t('foot');
    document.getElementById('bodies').innerHTML = '<span class="on">' + t('body.county') + '</span><span class="soon">' + t('body.cities') + '</span><span class="soon">' + t('body.state') + '</span>';
    document.getElementById('filters').innerHTML = ['all', 'gift', 'split', 'lob'].map(function(k){
      return '<button data-f="' + k + '" class="' + (F === k ? 'on' : '') + '">' + t('f' + k.charAt(0).toUpperCase() + k.slice(1)) + '</button>';
    }).join('');
    document.querySelectorAll('#filters button').forEach(function(b){ b.addEventListener('click', function(){ F = b.getAttribute('data-f'); render(); }); });
    var B = body();
    if(!B) return;
    var A = B.actions;
    document.getElementById('stats').innerHTML =
      '<div><b>' + A.length + '</b>' + t('sActs', {date: esc(day(B.since))}) + '</div>' +
      '<div><b>' + A.filter(function(a){ return (a.lobbied || []).length; }).length + '</b>' + t('sLob') + '</div>' +
      '<div><b>' + A.filter(hasGift).length + '</b>' + t('sGift') + '</div>' +
      (DATA.updated ? '<div><b>' + esc(day(DATA.updated)) + '</b>' + t('sUpdated') + '</div>' : '');
    var on = Object.keys(B.onBallot);
    document.getElementById('ballot').innerHTML = on.map(function(k){
      return '<div>' + esc(t('onBallot', {name: mem(B, k).name, race: L(B.onBallot[k].race), accts: acctNames(B, B.onBallot[k].accounts)})) + ' ' +
        B.onBallot[k].accounts.map(function(x){ return link(B.accounts[x].url, L(B.accounts[x].name)); }).join(' · ') + '</div>';
    }).join('') + '<div class="muted">' + esc(t('offBallot', {n: B.members.length - on.length})) + '</div>';
    document.getElementById('list').innerHTML = A.map(function(a){ return actHtml(B, a); }).join('');
    filter();
  }
  function filter(){
    var q = norm(document.getElementById('q').value).trim(), any = false;
    document.querySelectorAll('.act').forEach(function(el){
      var ok = (!q || el.getAttribute('data-search').indexOf(q) >= 0) && (F === 'all' || el.getAttribute('data-' + F) === '1');
      el.hidden = !ok; if(ok) any = true;
    });
    document.getElementById('noresult').hidden = any || !DATA;
  }
  document.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click', function(){ LANG = b.getAttribute('data-lang'); try { localStorage.setItem('ballot305.lang', LANG); } catch(e){} render(); });
  });
  document.getElementById('q').addEventListener('input', filter);
  render();
  fetch('/data/decisions.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ DATA = j; render(); })
    .catch(function(){ document.getElementById('list').innerHTML = '<p class="empty">' + esc(t('loadErr')) + '</p>'; });
})();
</script>
</body>
</html>
