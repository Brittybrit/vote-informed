<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALLOT305.ORG - For an Informed, Engaged Miami-Dade</title>
<meta name="description" content="Free, nonpartisan research on every race and referendum on the Miami-Dade ballot. See who funds each candidate and measure, who endorses them, with sources. Build your ballot plan and print it.">
<meta name="theme-color" content="#131F3C">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ballot305.org/">
<meta property="og:site_name" content="Ballot305">
<meta property="og:title" content="Ballot305: Follow the money, honey">
<meta property="og:description" content="Every race and referendum on the Miami-Dade ballot. Who funds them, who endorses them, with sources. Free and nonpartisan.">
<meta property="og:image" content="https://ballot305.org/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ballot305 logo with the tagline Follow the money, honey">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ballot305: Follow the money, honey">
<meta name="twitter:description" content="Every race and referendum on the Miami-Dade ballot. Who funds them, who endorses them, with sources.">
<meta name="twitter:image" content="https://ballot305.org/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF7;
    --ink:#131F3C;
    --ink-soft:#3D4763;
    --rule:#131F3C;
    --left-bg:#E3ECFB; --left-fg:#1D4ED8;
    --right-bg:#FBE5E5; --right-fg:#B91C1C;
    --nonp-bg:#E8EAED; --nonp-fg:#374151;
    --group-bg:#F2EFE6; --group-fg:#6B5D3F;
    --flag-bg:#FDF1D8; --flag-fg:#8A5A0B; --flag-rule:#D9A93F;
    --ok-bg:#E6F0E8; --ok-fg:#2F6B3C;
    --vote-bg:#EEF5EF;
    --panel:#FFFFFF;
    --sans:'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden;}
  html,body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  :focus-visible{outline:3px solid var(--left-fg); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

  header{
    border-bottom:4px solid var(--rule);
    padding:28px 24px 18px;
    display:flex; align-items:flex-end; justify-content:center; gap:16px; flex-wrap:wrap;
    text-align:center;
  }
  header.with-ballot{justify-content:space-between; text-align:left;}
  .masthead h1{
    font-weight:900; text-transform:uppercase; letter-spacing:.01em;
    font-size:34px; line-height:1;
  }
  .wordmark .o{display:inline-block; width:.86em; height:.56em; background:var(--ink); border-radius:50%; margin:0 .03em; vertical-align:.07em;}
  .wordmark .dotorg{font-weight:600; font-size:.62em; opacity:.75; margin-left:.04em;}
  .langs{display:flex; gap:6px; justify-content:center; margin-top:12px;}
  header.with-ballot .langs{justify-content:flex-start;}
  .langs button{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; background:transparent; border:1.5px solid var(--rule); color:var(--ink); padding:5px 10px; cursor:pointer;}
  .langs button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tagline{font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-top:8px;}
  @media (max-width:520px){ .masthead h1{font-size:28px;} }
  .masthead .sub{
    font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); margin-top:8px; letter-spacing:.04em;
  }
  .juris{
    font-family:var(--mono); font-size:12.5px; text-align:right; color:var(--ink-soft);
    border:1.5px solid var(--rule); padding:8px 12px; display:none;
  }
  .juris strong{color:var(--ink); display:block; font-size:13px;}

  .votenow{display:none; max-width:640px; margin:22px auto 0; border:3px solid var(--rule); background:var(--panel); padding:16px 18px;}
  .votenow.show{display:block;}
  main.with-ballot .votenow{max-width:none;}
  .vb-row{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .vb-kicker{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);}
  .vb-head{font-weight:900; font-size:20px; letter-spacing:.01em; margin-top:2px;}
  .vb-head .live{display:inline-block; width:10px; height:10px; border-radius:50%; background:#1F7A3A; margin-right:8px; vertical-align:2px;}
  .vb-sub{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .vb-btn{display:inline-block; background:var(--ink); color:var(--paper); border:none; font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; padding:12px 16px; cursor:pointer; text-decoration:none; font-family:inherit;}
  .vb-btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--ink);}
  .vb-sites{margin-top:14px; border-top:1.5px solid var(--rule);}
  .vb-site{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px dotted var(--rule);}
  .vb-site .nm{font-weight:800; font-size:15px;}
  .vb-site .ad{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .vb-site .dist{font-family:var(--mono); font-size:12px; color:var(--ink); margin-top:2px;}
  .vb-site .vb-btn{padding:9px 12px; font-size:12px; white-space:nowrap;}
  .vb-note{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.6;}
  .vb-note a{color:inherit;}
  main{max-width:1180px; margin:0 auto; padding:0 24px 80px;}

  .upload-stage{padding:44px 0 40px; max-width:640px; margin:0 auto;}
  .countdown{border:3px solid var(--rule); background:var(--panel); text-align:center; padding:26px 20px 22px; margin:30px 0 18px;}
  .cd-num{font-weight:900; font-size:clamp(64px, 16vw, 120px); line-height:.95; letter-spacing:-.01em;}
  .cd-label{font-family:var(--mono); font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:10px; line-height:1.7;}
  .cd-label strong{color:var(--ink);}
  .regcheck{margin-bottom:26px;}
  .rc-q{font-weight:900; text-transform:uppercase; letter-spacing:.02em; font-size:20px; text-align:center; margin-bottom:14px;}
  .rc-opts{display:grid; gap:10px;}
  .rc-opt{
    display:block; width:100%; text-align:left; background:var(--panel); border:3px solid var(--rule);
    padding:14px 18px; text-decoration:none; color:var(--ink); cursor:pointer; transition:background .12s;
  }
  .rc-opt:hover{background:#EFF3FA;}
  .rc-big{display:block; font-weight:900; font-size:19px; letter-spacing:.02em;}
  .rc-sub{display:block; font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .rc-note{font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-align:center; margin-top:12px;}
  .dropzone{
    border:3px dashed var(--rule); background:var(--panel);
    padding:56px 32px; text-align:center; transition:background .15s;
  }
  .dropzone.dragover{background:#EFF3FA;}
  .dropzone .oval-demo{width:44px; height:26px; border:3px solid var(--ink); border-radius:50%; margin:0 auto 20px;}
  .dropzone h2{font-weight:800; font-size:20px; text-transform:uppercase; letter-spacing:.03em;}
  .dropzone p{color:var(--ink-soft); margin-top:10px; font-size:14.5px; line-height:1.5;}
  .dropzone .btn{
    margin-top:22px; background:var(--ink); color:var(--paper); border:none;
    font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:13.5px;
    padding:13px 26px;
  }
  .dropzone .btn:hover{background:#0A1330;}
  .resume-box{
    border:3px solid var(--rule); background:var(--vote-bg); padding:18px 22px; margin-bottom:18px;
    display:none; text-align:center;
  }
  .resume-box p{font-size:14px;}
  .resume-box strong{font-weight:800;}
  .resume-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid #C9D3C9; text-align:left;}
  .resume-row:first-of-type{margin-top:10px;}
  .rr-label{font-size:13.5px; font-weight:600; min-width:0; overflow-wrap:anywhere;}
  .rr-meta{font-family:var(--mono); font-size:11px; font-weight:400; color:var(--ink-soft);}
  .rr-actions{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .rr-actions .btn2{margin-top:0;}
  .rr-del{background:none; border:1.5px solid var(--rule); font-family:var(--mono); font-size:11px; padding:6px 9px;}
  .rr-del:hover{background:var(--right-bg); border-color:var(--right-fg); color:var(--right-fg);}
  .resume-box .btn2{
    margin-top:12px; background:var(--ink); color:var(--paper); border:none;
    font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:12.5px; padding:10px 20px;
  }
  .getballot{margin-top:22px; text-align:left;}
  .gb-head{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); text-align:center; margin-bottom:10px;}
  .gb-opt{
    display:block; width:100%; text-align:left; font-family:inherit; cursor:pointer;
    border:2px solid var(--rule); background:var(--paper); padding:12px 14px;
    margin-top:8px; text-decoration:none; color:var(--ink); transition:background .12s;
  }
  .gb-opt:hover{background:#EFF3FA;}
  .gb-title{display:block; font-weight:800; font-size:14px;}
  .gb-desc{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.45;}
  .finehint{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-top:16px; text-align:center; line-height:1.6;}

  .statusline{
    display:none; margin:24px auto 0; max-width:640px;
    font-family:var(--mono); font-size:13px; padding:16px 18px;
    border:1.5px solid var(--rule); background:var(--panel);
  }
  .statusline .dots::after{content:''; animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .statusline.error{border-color:var(--right-fg); color:var(--right-fg); background:var(--right-bg);}

  .workspace{display:none; grid-template-columns:minmax(0,1fr) 420px; gap:36px; margin-top:32px;}
  @media (max-width:960px){ .workspace{grid-template-columns:minmax(0,1fr);} }

  /* ---------- plan bar ---------- */
  .planbar{
    border:3px solid var(--rule); background:var(--panel); margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 16px; flex-wrap:wrap;
  }
  .planbar .ptitle{font-weight:800; text-transform:uppercase; font-size:13px; letter-spacing:.06em;}
  .planbar .pcount{font-family:var(--mono); font-size:12px; color:var(--ink-soft);}
  .planbar .pmeter{
    flex:1 1 140px; height:10px; border:1.5px solid var(--rule); background:var(--paper); min-width:0;
  }
  @media (max-width:640px){
    .planbar{display:grid; grid-template-columns:1fr auto; align-items:center;}
    .planbar .pcount{grid-column:1;}
    .planbar button{grid-column:2; grid-row:1 / span 2;}
    .planbar .pmeter{grid-column:1 / -1; width:100%;}
  }
  .planbar .pmeter i{display:block; height:100%; background:var(--ink); transition:width .2s;}
  .planbar button{
    background:var(--ink); color:var(--paper); border:none; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; font-size:12px; padding:9px 16px;
  }

  /* ---------- plan view ---------- */
  .planview{display:none; border:3px solid var(--rule); background:var(--panel); margin-bottom:22px;}
  .planview.open{display:block;}
  .planview-head{background:var(--ink); color:var(--paper); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .planview-head h3{font-weight:800; text-transform:uppercase; font-size:14px; letter-spacing:.05em;}
  .planview-head .actions{display:flex; gap:8px;}
  .planview-head button{
    background:none; border:1.5px solid rgba(250,250,247,.6); color:var(--paper);
    font-family:var(--mono); font-size:11.5px; padding:5px 12px;
  }
  .plan-row{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid #D8D8D2; font-size:14.5px;}
  .plan-row:last-child{border-bottom:none;}
  .plan-row .pr-office{flex:1; font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .plan-row .pr-pick{flex:1.2; font-weight:800;}
  .plan-row .pr-pick.undecided{font-weight:400; color:var(--ink-soft); font-style:italic;}
  .plan-row .pr-remove{
    background:none; border:1.5px solid var(--rule); font-family:var(--mono); font-size:10.5px;
    padding:4px 10px; white-space:nowrap;
  }
  .plan-row .pr-remove:hover{background:var(--right-bg); border-color:var(--right-fg); color:var(--right-fg);}

  .race{border:3px solid var(--rule); background:var(--panel); margin-bottom:22px;}
  .race-head{
    background:var(--ink); color:var(--paper); padding:10px 16px;
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 12px;
  }
  .race-head h3{min-width:0;}
  .race-head h3{font-weight:800; text-transform:uppercase; font-size:14.5px; letter-spacing:.05em;}
  .race-head .jbadge{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid rgba(250,250,247,.6); padding:2.5px 8px; white-space:normal; max-width:100%; line-height:1.45;
  }
  .race-instr{font-family:var(--mono); font-size:11px; color:var(--ink-soft); padding:8px 16px; border-bottom:1px solid #D8D8D2;}

  .cand{
    display:flex; align-items:center; gap:14px; width:100%; min-width:0; text-align:left;
    background:none; border:none; border-bottom:1px solid #D8D8D2;
    padding:13px 16px; transition:background .12s; position:relative;
  }
  .cand > span:nth-of-type(2){flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .cand:last-child{border-bottom:none;}
  .cand:hover{background:#F2F4F8;}
  .cand.active{background:#E9EEF7;}
  .cand.voted{background:var(--vote-bg); box-shadow:inset 5px 0 0 var(--ok-fg);}
  .oval-btn{
    flex:0 0 34px; height:20px; border:2.5px solid var(--ink); border-radius:50%;
    background:var(--panel); padding:0; transition:background .15s;
  }
  .oval-btn:hover{background:#C9D3E8;}
  .cand.voted .oval-btn{background:var(--ink);}
  .cand .cname{font-weight:800; font-size:16px;}
  .cand .cparty{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .cand .votetag{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--ok-fg);
    font-weight:600; display:none; margin-top:3px;
  }
  .cand.voted .votetag{display:block;}
  .ret-q{padding:12px 16px 2px; font-weight:800; font-size:17px;}
  .cand.ret-judge{cursor:pointer;}
  .cand.ret-opt .cname{font-size:15px;}
  .cand .peek{margin-left:auto; flex:0 0 auto; font-family:var(--mono); font-size:11px; color:var(--ink-soft); white-space:nowrap;}

  .dossier{
    border:3px solid var(--rule); background:var(--panel);
    position:sticky; top:20px; align-self:start; max-height:calc(100vh - 40px); overflow-y:auto;
  }
  @media (max-width:960px){
    .dossier{position:fixed; inset:0; z-index:50; align-self:stretch; height:100vh; height:100dvh; max-height:none; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; border:none; border-top:6px solid var(--rule); display:none;}
    .dossier.open{display:block;}
  }
  .dossier-empty{padding:48px 28px; text-align:center; color:var(--ink-soft);}
  .dossier-empty .oval-demo{width:38px; height:22px; border:2.5px solid var(--ink-soft); border-radius:50%; margin:0 auto 16px;}
  .dossier-empty p{font-size:14px; line-height:1.55;}

  .dossier-head{background:var(--ink); color:var(--paper); padding:16px 20px; position:relative;}
  .dossier-head .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.75;}
  .dossier-head h2{font-weight:900; font-size:22px; margin-top:4px; line-height:1.15;}
  .dossier-head .office{font-family:var(--mono); font-size:12px; margin-top:6px; opacity:.85;}
  .dossier-close{
    position:absolute; top:12px; right:12px; background:none; border:1.5px solid rgba(250,250,247,.5);
    color:var(--paper); font-family:var(--mono); font-size:12px; padding:4px 10px;
  }
  .cachebadge{
    display:inline-block; margin-top:8px; font-family:var(--mono); font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; border:1px solid rgba(250,250,247,.5);
    padding:2px 8px; opacity:.85;
  }
  .votebar{padding:14px 20px; border-bottom:2.5px solid var(--rule); background:var(--vote-bg);}
  .votebar button{
    width:100%; border:none; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    font-size:13px; padding:12px;
  }
  .votebar button.mark{background:var(--ink); color:var(--paper);}
  .votebar button.mark:hover{background:#0A1330;}
  .votebar button.unmark{background:var(--panel); color:var(--right-fg); border:2px solid var(--right-fg);}
  .votebar .swapnote{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:8px; text-align:center;}
  .mv-row{display:flex; gap:8px;}
  .mv-row button{flex:1;}
  .fin-side{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); border-bottom:1px solid #C9C9C1; padding:10px 0 4px; margin-bottom:2px;}
  .tag.amtchip{background:var(--ink); color:var(--paper);}

  .dossier-body{padding:20px; overflow-wrap:break-word;}
  .dsec{margin-bottom:26px;}
  .dsec h4{
    font-weight:800; text-transform:uppercase; font-size:12.5px; letter-spacing:.08em;
    border-bottom:2.5px solid var(--rule); padding-bottom:6px; margin-bottom:12px;
  }
  .donor-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:8px 0; border-bottom:1px dotted #C9C9C1; font-size:14px;}
  .donor-row:last-child{border-bottom:none;}
  .donor-row > div{flex:1 1 auto; min-width:0;}
  .donor-row .dname{font-weight:600; overflow-wrap:anywhere;}
  .donor-row .damt{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); flex:0 0 auto; max-width:38%; text-align:right; overflow-wrap:anywhere;}
  .donor-row .dtype{font-family:var(--mono); font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; margin-top:4px;}

  .endo{padding:10px 0; border-bottom:1px dotted #C9C9C1;}
  .endo:last-child{border-bottom:none;}
  .endo .eorg{font-weight:600; font-size:14px;}
  .endo .enote{font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.45;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .tag{
    font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    padding:3px 8px; font-weight:600;
  }
  .tag.left{background:var(--left-bg); color:var(--left-fg);}
  .tag.right{background:var(--right-bg); color:var(--right-fg);}
  .tag.nonpartisan{background:var(--nonp-bg); color:var(--nonp-fg);}
  .tag.group{background:var(--group-bg); color:var(--group-fg);}
  .tag.kind{border:1.5px solid currentColor;}
  .tag.kind.kpac{background:#FDF3C8; color:#7A5D00;}
  .tag.kind.kcorp{background:#FBE9E7; color:#B3261E;}
  .tag.kind.kindiv{background:#E2F2E4; color:#1E7A34;}
  .tag:not(.amtchip){cursor:help; text-decoration:underline dashed 1px; text-underline-offset:2.5px;}
  #tagpop{
    display:none; position:fixed; z-index:200; max-width:290px;
    background:var(--ink); color:var(--paper); border:1.5px solid var(--paper);
    box-shadow:4px 4px 0 rgba(19,31,60,.35); padding:12px 14px;
  }
  #tagpop .tp-title{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.8;}
  #tagpop .tp-body{font-size:13px; line-height:1.5; margin-top:5px;}

  .fedsoc{border:2px solid var(--flag-rule); background:var(--flag-bg); padding:14px 16px;}
  .fedsoc.none{border-color:#9DB8A4; background:var(--ok-bg);}
  .fedsoc .fstatus{font-weight:800; text-transform:uppercase; font-size:12.5px; letter-spacing:.06em; color:var(--flag-fg);}
  .fedsoc.none .fstatus{color:var(--ok-fg);}
  .fedsoc ul{margin-top:10px; padding-left:18px;}
  .fedsoc li{font-size:13.5px; line-height:1.5; margin-bottom:8px;}
  .fedsoc li .src{font-family:var(--mono); font-size:11px; color:var(--ink-soft); display:block;}
  .fedsoc a{color:inherit;}
  .srclink{
    font-family:var(--mono); font-size:10.5px; color:var(--left-fg);
    text-decoration:underline; text-underline-offset:2px; white-space:nowrap;
  }
  .tagrow .srclink{align-self:center;}
  .sumsrc{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.7; overflow-wrap:anywhere;}
  .sumsrc a{color:inherit;}
  .mny-lead{font-size:14px; line-height:1.5; margin-bottom:14px;}
  .mny-label{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:12px 0 6px;}
  .mny-bar{display:flex; height:30px; border:2px solid var(--ink); background:var(--paper); overflow:hidden;}
  .mny-bar a, .mny-bar span{display:block; min-width:3px; border-right:2px solid var(--panel); text-decoration:none;}
  .mny-bar > :last-child{border-right:none;}
  .mny-bar a:hover, .mny-bar a:focus-visible{filter:brightness(1.18); outline:none;}
  .mny-bar .rc{background:#B8BFCC;}
  .mny-bar .rc.me{background:var(--ink);}
  .mny-key{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-size:12.5px;}
  .mny-key a{color:var(--ink-soft); text-decoration:none;}
  .mny-key a.me{color:var(--ink); font-weight:700;}
  .mny-key a:hover{text-decoration:underline;}
  .mny-zoom{height:10px; margin:4px 0 0; position:relative;}
  .mny-zoom div{position:absolute; top:0; height:100%; border-left:1.5px dashed var(--ink-soft); border-right:1.5px dashed var(--ink-soft); border-bottom:1.5px dashed var(--ink-soft);}
  .mrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dotted #C9C9C1; font-size:13.5px; color:var(--ink); text-decoration:none;}
  .mrow:last-child{border-bottom:none;}
  a.mrow:hover .ml{text-decoration:underline;}
  .mrow .sw{flex:0 0 14px; height:14px; border:1px solid rgba(19,31,60,.35);}
  .mrow .ml{flex:1 1 auto; min-width:0;}
  .mrow .mv{font-family:var(--mono); font-size:12px; color:var(--ink-soft); text-align:right; white-space:nowrap;}
  .mrow .mgo{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); white-space:nowrap; min-width:64px; text-align:right;}
  .mny-sum{font-size:13.5px; margin-top:12px; padding:9px 12px; background:var(--paper); border-left:4px solid var(--ink);}
  .mny-note{font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-soft); margin-top:10px;}
  .fulllist{display:inline-block; margin-top:12px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); border:2px solid var(--ink); padding:8px 12px; text-decoration:none;}
  .fulllist:hover{background:var(--ink); color:var(--paper);}
  .srcs{font-family:var(--mono); font-size:11.5px; line-height:1.7; color:var(--ink-soft); overflow-wrap:anywhere; word-break:break-all;}
  .srcs .srclink{white-space:normal; overflow-wrap:anywhere; word-break:break-all;}
  .ratingval{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.03em;
    border:1.5px solid var(--rule); padding:2px 8px; margin-left:6px; white-space:nowrap;
  }

  .d-loading{padding:40px 24px; text-align:center;}
  .d-loading .oval-anim{width:44px; height:26px; border:3px solid var(--ink); border-radius:50%; margin:0 auto 18px; position:relative; overflow:hidden;}
  .d-loading .oval-anim::after{content:''; position:absolute; inset:0; background:var(--ink); transform:translateX(-100%); animation:fillslide 1.6s ease-in-out infinite;}
  @keyframes fillslide{0%{transform:translateX(-100%)}55%{transform:translateX(0)}100%{transform:translateX(100%)}}
  .d-loading p{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft);}
  .d-error{padding:24px; font-size:14px; color:var(--right-fg);}
  .d-error button{margin-top:12px; background:var(--ink); color:var(--paper); border:none; padding:9px 18px; font-weight:700; font-size:13px;}

  .disclaimer{
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); line-height:1.65;
    border-top:1px solid #D8D8D2; padding-top:14px; margin-top:6px;
  }
  .reset-row{margin:24px 0 0; text-align:right;}
  .reset-row button{background:none; border:1.5px solid var(--rule); font-family:var(--mono); font-size:12px; padding:7px 14px;}
  .sitefoot{font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-align:center; line-height:1.9; border-top:1.5px solid var(--rule); margin-top:40px; padding-top:16px;}
  .sitefoot a{color:var(--left-fg); text-decoration:underline; text-underline-offset:2px;}

  /* ---------- print: only the ballot plan ---------- */
  #printPlan{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printPlan, #printPlan *{visibility:visible;}
    #printPlan{
      display:block; position:absolute; top:0; left:0; width:100%;
      font-family:Georgia, serif; color:#000; padding:24px;
    }
    #printPlan h1{font-size:20px; border-bottom:3px solid #000; padding-bottom:8px; margin-bottom:4px;}
    #printPlan .pj{font-size:12px; margin-bottom:18px;}
    #printPlan table{width:100%; border-collapse:collapse;}
    #printPlan td{border-bottom:1px solid #999; padding:8px 4px; font-size:13px; vertical-align:top;}
    #printPlan td.of{width:45%; text-transform:uppercase; font-size:11px; letter-spacing:.03em;}
    #printPlan td.pk{font-weight:bold;}
    #printPlan .pnote{font-size:10px; margin-top:16px; color:#333;}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <h1 class="wordmark" aria-label="Ballot305.org">BALL<span class="o" aria-hidden="true"></span>T305<span class="dotorg">.ORG</span></h1>
    <div class="tagline" data-i18n="tagline"></div>
    <div class="sub" data-i18n="sub"></div>
    <div class="langs" role="group" aria-label="Language / Idioma / Lang"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="ht">KREYÒL</button></div>
  </div>
  <div class="juris" id="jurisBox"></div>
</header>

<main>
  <section class="votenow" id="voteBar" aria-live="polite"></section>
  <div class="statusline" id="statusLine"></div>

  <section class="upload-stage" id="uploadStage">
    <div class="resume-box" id="resumeBox"></div>
    <div id="uploadFlow">
    <div class="dropzone" id="dropzone">
      <div class="oval-demo"></div>
      <h2 data-i18n="dz.h2"></h2>
      <p data-i18n="dz.p"></p>
      <button class="btn" id="pickBtn" data-i18n="dz.pick"></button>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <div class="getballot">
        <p class="gb-head" data-i18n="gb.head"></p>
        <a class="gb-opt" href="https://www.voterfocus.com/VoterInformationLookup/voterSearch?county=FL-DAD" target="_blank" rel="noopener">
          <span class="gb-title" data-i18n="gb.exact.t"></span>
          <span class="gb-desc" data-i18n="gb.exact.d"></span>
        </a>
        <button class="gb-opt" id="loadMaster" type="button">
          <span class="gb-title" data-i18n="gb.master.t"></span>
          <span class="gb-desc" data-i18n="gb.master.d"></span>
        </button>
      </div>
    </div>
    <p class="finehint" data-i18n="finehint"></p>
    </div>

    <div class="countdown" id="countdown">
      <div class="cd-num" id="cdNum"></div>
      <div class="cd-label" id="cdLabel"></div>
    </div>

    <div class="regcheck" id="regCheck">
      <div class="rc-opts">
        <a class="rc-opt" href="https://www.voterfocus.com/VoterInformationLookup/voterSearch?county=FL-DAD" target="_blank" rel="noopener">
          <span class="rc-big" data-i18n="rc.check.big"></span>
          <span class="rc-sub" data-i18n="rc.check.sub"></span>
        </a>
        <a class="rc-opt" href="https://registertovoteflorida.gov/" target="_blank" rel="noopener">
          <span class="rc-big" data-i18n="rc.reg.big"></span>
          <span class="rc-sub" data-i18n="rc.reg.sub"></span>
        </a>
      </div>
    </div>
  </section>

  <section class="workspace" id="workspace">
    <div>
      <div class="planbar">
        <span class="ptitle" data-i18n="plan.title"></span>
        <span class="pcount" id="planCount">0 of 0 races decided</span>
        <span class="pmeter"><i id="planMeter" style="width:0%"></i></span>
        <button id="planToggle" data-i18n="plan.view"></button>
      </div>
      <div class="planview" id="planView">
        <div class="planview-head">
          <h3 data-i18n="plan.yours"></h3>
          <div class="actions">
            <button id="printBtn" data-i18n="plan.print"></button>
            <button id="clearBtn" data-i18n="plan.clear"></button>
          </div>
        </div>
        <div id="planRows"></div>
      </div>
      <div id="races"></div>
      <div class="reset-row"><button id="resetBtn" data-i18n="plan.reset"></button></div>
    </div>
    <aside class="dossier" id="dossier" aria-live="polite">
      <div class="dossier-empty" id="dossierEmpty">
        <div class="oval-demo"></div>
        <p data-i18n="dossier.empty"></p>
      </div>
      <div id="dossierContent"></div>
    </aside>
  </section>
  <p class="sitefoot" data-i18n="foot"></p>
</main>

<div id="tagpop" role="tooltip"></div>

<div id="printPlan"></div>

  'tag.super.l': 'Super PAC', 'tag.super.d': 'A committee that can raise unlimited money from people, companies and unions, but cannot give it directly to candidates. It spends on its own ads instead. One appearing here usually means a hybrid super PAC giving from a separate, limited account.',
  'tag.noncon.l': 'Nonconnected PAC', 'tag.noncon.d': 'A PAC not tied to any company, union or association. Usually an ideological, issue or leadership PAC that raises from individuals. Limited to $5,000 per election to a candidate.',
  'tag.con.l': 'Connected PAC', 'tag.con.d': 'A PAC run by a corporation, union, trade group or membership association, funded by its employees or members. Shows which industries or organized interests back the candidate. Limited to $5,000 per election.',
  'tag.party.l': 'Party Organization', 'tag.party.d': 'An official political party organization: local, state, or national.',
  'tag.candcom.l': 'Candidate Committee', 'tag.candcom.d': 'Another candidate&rsquo;s own campaign committee giving to this one.',
  'tag.pac.l': 'PAC / Committee', 'tag.pac.d': 'A Political Action Committee: a group registered to raise and spend money to influence elections. Money given through a PAC can make the original source harder to see; the source link shows its filings.',
  'tag.corp.l': 'Corporation', 'tag.corp.d': 'A business giving money directly or through a company-linked committee. Corporate giving usually tracks the company&rsquo;s regulatory and business interests.',
  'tag.indiv.l': 'Individual', 'tag.indiv.d': 'A named person giving their own money. Their employer is shown when disclosed, which can hint at an industry interest behind the gift.',
  'tag.self.l': 'Self-Funded', 'tag.self.d': 'The candidate&rsquo;s own money.',
  'tag.union.l': 'Labor Union', 'tag.union.d': 'A union giving through its political arm, funded by member dues. Generally supports worker-protection and collective-bargaining policies.',
  'tag.lobby.l': 'Lobbying / Trade Group', 'tag.lobby.d': 'An association that represents an industry&rsquo;s interests to government. Its money and endorsements usually track that industry&rsquo;s policy goals.',
  'tag.nonprofit.l': 'Nonprofit', 'tag.nonprofit.d': 'A nonprofit organization. Some kinds are not required to disclose their own donors, so the original source of the money may be hidden (sometimes called dark money).',
  'tag.police.l': 'Law Enforcement', 'tag.police.d': 'A police union or law-enforcement association.',
  'tag.editorial.l': 'Editorial Board', 'tag.editorial.d': 'The opinion side of a newspaper, which endorses candidates. It operates separately from the paper&rsquo;s news reporting.',
  'tag.business.l': 'Business Association', 'tag.business.d': 'A chamber-of-commerce-style group representing local business interests.',
  'tag.env.l': 'Environmental Group', 'tag.env.d': 'An organization focused on environmental and conservation policy.',
  'tag.religious.l': 'Religious Organization', 'tag.religious.d': 'A faith-based organization or advocacy group.',
  'tag.civil.l': 'Civil Rights Organization', 'tag.civil.d': 'A group focused on civil rights and liberties.',
  'tag.prof.l': 'Professional Association', 'tag.prof.d': 'A membership body for a profession, such as a bar association. Often rates candidates rather than endorsing.',
  'tag.official.l': 'Elected Official', 'tag.official.d': 'A current or former officeholder endorsing personally.'

  'tag.lobby.l': 'Grupo de cabildeo / gremial', 'tag.lobby.d': 'Una asociación que representa los intereses de una industria ante el gobierno. Su dinero y sus respaldos suelen seguir los objetivos de política de esa industria.',
  'tag.nonprofit.l': 'Organización sin fines de lucro', 'tag.nonprofit.d': 'Una organización sin fines de lucro. Algunos tipos no están obligados a revelar sus propios donantes, así que la fuente original del dinero puede estar oculta (a veces llamado dinero oscuro).',

var LANGS = ['en', 'es', 'ht'];
var LANG = (function(){
  try { var s = localStorage.getItem('ballot305.lang'); if (LANGS.indexOf(s) >= 0) return s; } catch(e){}
  var n = (navigator.language || 'en').toLowerCase();
  if (n.indexOf('es') === 0) return 'es';
  if (n.indexOf('ht') === 0) return 'ht';
  return 'en';
})();

// Translated string with {placeholders} filled in. Values in vars are inserted as given,
// so escape untrusted text before passing it.
function t(key, vars){
  var s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : I18N.en[key];
  if (s == null) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? vars[k] : m; });
  return s;
}

  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

function trBallot(){ return (ballot && ballot.tr && ballot.tr[LANG]) || null; }
function officeOf(ri){ var tr = trBallot(); return (tr && tr.offices && tr.offices[ri]) || ballot.races[ri].office; }

  if(race.isMeasure && tr && tr.measureOptions && tr.measureOptions[ri] && tr.measureOptions[ri][ci]) return tr.measureOptions[ri][ci];

  b.races.forEach(function(race, ri){
    if(!race || race.isMeasure || !race.isJudicial) return;
    var people = (race.candidates || []).filter(function(c){ return c && c.name && !YESNO_RE.test(String(c.name).trim()); });
    if(people.length > 1) return;
    if(!race.isRetention && people.length !== 1 && !RETAIN_RE.test(race.office || '')) return;
    var judge = people[0];
    if(!judge){
      var m = (race.office || '').match(/shall\s+(?:justice|judge)\s+(.+?)\s+of\s+the/i);
      if(!m) return;
      judge = { name: m[1], party: '' };
    }
    race.isRetention = true;
    race.candidates = [judge];
    if(v && typeof v[ri] === 'number') delete v[ri];
  });
}
function retLabel(ri, v){
  return t(v === 'yes' ? 'ret.yesShort' : 'ret.noShort', {name: esc(candName(ri, 0))});
}
function bt(field){ var tr = trBallot(); return (tr && tr[field]) || ballot[field]; }

// Fetch translated titles without blocking: the ballot shows in English first and
// re-renders when the translation arrives. Returns immediately.
var trPending = {};
function translateBallotInBackground(){
  if(LANG === 'en' || !ballot || (ballot.tr && ballot.tr[LANG])) return;
  var want = LANG, forBallot = ballot, k = currentId + '|' + (lastPdf ? 'pdf' : want);
  if(trPending[k]) return;
  trPending[k] = true;
  ensureBallotTranslation(true).then(function(){
    delete trPending[k];
    if(ballot === forBallot && LANG === want && ballot.tr && ballot.tr[want]){
      renderBallot();
      if(activeKey){
        var parts = activeKey.split(':');
        if(parts[0] === 'm') selectMeasure(parseInt(parts[1], 10));
        else if(cache[activeKey]) renderDossier(ballot.races[parseInt(parts[0],10)].candidates[parseInt(parts[1],10)], ballot.races[parseInt(parts[0],10)], cache[activeKey].result, cache[activeKey].cached);
      }
    }
  });
}

var lastPdf = null;   // the PDF behind the current ballot, while this page is open

async function ensureBallotTranslation(quiet){
  if(LANG === 'en' || !ballot || (ballot.tr && ballot.tr[LANG])) return;
  if(!quiet) setStatus(t('status.translating'), false, true);
  // Best: the Spanish and Kreyol printed on the ballot itself (official county wording).
  if(lastPdf){
    try{
      var both = await api('/api/ballot-text', {
        pdf: lastPdf,
        electionName: ballot.electionName || '',
        offices: ballot.races.map(function(r){ return r.office; }),
        measureOptions: ballot.races.map(function(r){ return r.isMeasure ? r.candidates.map(function(c){ return c.name; }) : null; })
      });
      if(both && both.es && both.ht){
        ballot.tr = ballot.tr || {};
        ballot.tr.es = both.es; ballot.tr.ht = both.ht;
        saveState();
        if(!quiet) setStatus('');
        return;
      }
    }catch(e){ /* fall through to machine translation */ }
  }
  try{
    var data = await api('/api/translate-ballot', {
      lang: LANG,
      electionName: ballot.electionName || '',
      offices: ballot.races.map(function(r){ return r.office; }),
      measureOptions: ballot.races.map(function(r){ return r.isMeasure ? r.candidates.map(function(c){ return c.name; }) : null; })
    });
    ballot.tr = ballot.tr || {};
    ballot.tr[LANG] = data;
    saveState();
  }catch(e){ /* fall back to English titles */ }
  if(!quiet) setStatus('');
}

async function api(path, payload){
  var res = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  var data = await res.json().catch(function(){ return {error:'Bad response from server'}; });
  if(!res.ok) throw new Error(data.error || ('Server error ' + res.status));
  return data;
}

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

// Research runs in the background on the server; we poll until the shared
// cache fills. Keeps every request short so mobile browsers never time out.
async function research(payload){
  payload.poll = true;
  payload.lang = LANG;
  for(var i = 0; i < 45; i++){
    var data;
    try{
      data = await api('/api/research', payload);
    }catch(e){
      // brief network blips on cellular: retry the poll, not the research
      if(i > 0 && /load failed|failed to fetch|network/i.test(String(e.message))){ await sleep(4000); continue; }
      throw e;
    }
    if(data.result) return data;
    await sleep(4000);
  }
  throw new Error(t('err.slow'));
}

/* ---------------- persistence ---------------- */

function ballotId(b){
  return [(b.jurisdiction||''), (b.electionName||''), (b.electionDate||'')].join('|').toLowerCase().replace(/\s+/g,' ').trim() || 'unknown';
}

function loadStore(){
  try{
    var raw = localStorage.getItem(STORE);
    if(raw){
      var st = JSON.parse(raw);
      if(st && st.ballots) return st;
    }
    // move plans saved under the app's earlier name, so nobody loses their ballot plan
    var old2 = localStorage.getItem('ballotIntel.v2');
    if(old2){
      var s2 = JSON.parse(old2);
      if(s2 && s2.ballots){
        localStorage.setItem(STORE, old2);
        localStorage.removeItem('ballotIntel.v2');
        return s2;
      }
    }
    // migrate single-ballot v1 store if present
    var old1 = localStorage.getItem('ballotIntel.v1');
    if(old1){
      var s1 = JSON.parse(old1);
      if(s1 && s1.ballot && s1.ballot.races){
        var st2 = { ballots:{} };
        st2.ballots[ballotId(s1.ballot)] = { ballot:s1.ballot, votes:s1.votes||{}, ts:s1.ts||Date.now() };
        localStorage.setItem(STORE, JSON.stringify(st2));
        localStorage.removeItem('ballotIntel.v1');
        return st2;
      }
    }
  }catch(e){}
  return { ballots:{} };
}

function saveStore(st){
  try{ localStorage.setItem(STORE, JSON.stringify(st)); }catch(e){}
}

function saveState(){
  if(!ballot) return;
  var st = loadStore();
  st.ballots[currentId || ballotId(ballot)] = { ballot: ballot, votes: votes, ts: Date.now() };
  saveStore(st);
}

function deletePlan(id){
  var st = loadStore();
  delete st.ballots[id];
  saveStore(st);
  renderResumeList();
}

/* ---------------- upload + parse ---------------- */

async function handleFile(file){
  if(!file || file.type !== 'application/pdf'){
    setStatus(t('status.notpdf'), true);
    return;
  }
  setStatus(t('status.reading', {name: esc(file.name)}), false, true);

  var base64;
  try{
    base64 = await new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result.split(',')[1]); };
      r.onerror = function(){ reject(new Error('Could not read the file')); };
      r.readAsDataURL(file);
    });
  }catch(e){
    setStatus(t('status.cantread', {msg: esc(e.message)}), true);
    return;
  }

  setStatus(t('status.parsing'), false, true);
  try{
    lastPdf = base64;
    var data = await api('/api/parse', { pdf: base64 });
    applyParsed(data);
  }catch(e){
    setStatus(t('status.cantparse', {msg: esc(e.message)}), true);
  }
}

async function applyParsed(data){
  ballot = data.ballot;
  moneyCache = {};
  currentId = ballotId(ballot);
  var existing = loadStore().ballots[currentId];
  votes = (existing && existing.votes) ? existing.votes : {};
  if(existing && existing.ballot && existing.ballot.tr) ballot.tr = existing.ballot.tr;
  normalizeBallot(ballot, votes);
  saveState();
  renderBallot();
  setStatus('');
  translateBallotInBackground();
}

function bufToB64(buf){
  var bytes = new Uint8Array(buf);
  var bin = '';
  var chunk = 0x8000;
  for(var i = 0; i < bytes.length; i += chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

async function loadFeaturedBallot(){
  setStatus(t('status.loadingMaster'), false, true);
  try{
    var res = await fetch(FEATURED_BALLOT_PATH);
    if(!res.ok) throw new Error('Bundled ballot missing (HTTP ' + res.status + ')');
    var b64 = bufToB64(await res.arrayBuffer());
    setStatus(t('status.parsing'), false, true);
    lastPdf = b64;
    var data = await api('/api/parse', { pdf: b64 });
    applyParsed(data);
  }catch(e){
    setStatus(t('status.cantMaster', {msg: esc(e.message)}), true);
  }
}

function markActive(key){
  document.querySelectorAll('.cand').forEach(function(el){

  });

/* ---------------- ballot plan ---------------- */

function toggleVote(ri, ci){
  if(votes[ri] === ci){
    delete votes[ri];             // remove from plan
  } else {
    votes[ri] = ci;               // one pick per race — replaces any prior pick
  }
  saveState();
  refreshVoteUI();
  // if the dossier for this race is open, refresh its vote button
  if(activeKey){
    var parts = activeKey.split(':');
    if(parts[0] === 'm'){
      if(parseInt(parts[1],10) === ri && cache[activeKey]){
        renderMeasureDossier(ri, cache[activeKey].result, cache[activeKey].cached);
      }
    } else if(parseInt(parts[0],10) === ri && cache[activeKey]){
      var race = ballot.races[ri];
      var cand = race.candidates[parseInt(parts[1],10)];
      renderDossier(cand, race, cache[activeKey].result, cache[activeKey].cached);
    }
  }
}

function refreshVoteUI(){
  document.querySelectorAll('.cand').forEach(function(el){
    var parts = el.dataset.key.split(':');
    var want = /^\d+$/.test(parts[1]) ? parseInt(parts[1],10) : parts[1];
    var voted = votes[parseInt(parts[0],10)] === want;
    el.classList.toggle('voted', voted);
    var oval = el.querySelector('.oval-btn');
    if(oval) oval.setAttribute('aria-checked', voted ? 'true' : 'false');
  });
  var total = ballot ? ballot.races.length : 0;
  var decided = Object.keys(votes).length;
  $('planCount').innerHTML = t('plan.count', {d: decided, t: total});
  $('planMeter').style.width = (total ? Math.round(decided/total*100) : 0) + '%';
  renderPlanView();
}

function renderPlanView(){
  var rows = $('planRows');
  if(!ballot){ rows.innerHTML=''; return; }
  var html = '';
  ballot.races.forEach(function(race, ri){
    var ci = votes[ri];
    var ret = race.isRetention && (ci === 'yes' || ci === 'no');
    var picked = ret ? {} : (ci !== undefined && typeof ci === 'number') ? race.candidates[ci] : null;
    html += '<div class="plan-row">' +
      '<span class="pr-office">' + esc(officeOf(ri)) + '</span>' +
      (ret
        ? '<span class="pr-pick">' + retLabel(ri, ci) + '</span>' +
          '<button class="pr-remove" data-ri="' + ri + '">' + t('plan.remove') + '</button>'
        : picked
        ? '<span class="pr-pick">' + esc(candName(ri, ci)) + (picked.party ? ' <span style="font-weight:400;font-family:var(--mono);font-size:11px;color:var(--ink-soft)">(' + esc(picked.party) + ')</span>' : '') + '</span>' +
          '<button class="pr-remove" data-ri="' + ri + '">' + t('plan.remove') + '</button>'
        : '<span class="pr-pick undecided">' + t('plan.undecided') + '</span><span style="width:62px"></span>') +
      '</div>';
  });
  rows.innerHTML = html;
  rows.querySelectorAll('.pr-remove').forEach(function(b){
    b.addEventListener('click', function(){
      delete votes[parseInt(b.dataset.ri,10)];
      saveState(); refreshVoteUI();
    });
  });
}

function buildPrintPlan(){
  var el = $('printPlan');
  var html = '<h1>' + t('print.title') + '</h1>' +
    '<div class="pj">' + esc([ballot.jurisdiction, bt('electionName'), ballot.electionDate].filter(Boolean).join(' · ')) + '</div>' +
    '<table>';
  ballot.races.forEach(function(race, ri){

    html += '<tr><td class="of">' + esc(officeOf(ri)) + '</td><td class="pk">' +

/* ---------------- research ---------------- */

async function selectCandidate(ri, ci){
  var race = ballot.races[ri];
  if(race.isMeasure) return selectMeasure(ri);
  var cand = race.candidates[ci];
  var key = ri + ':' + ci;
  activeKey = key;
  markActive(key);
  openDossier();

  if(cache[key]){
    renderDossier(cand, race, cache[key].result, cache[key].cached);
    return;
  }

  renderDossierLoading(cand, race);

  try{
    var data = await research({
      name: cand.name,
      office: race.office,
      jurisdiction: ballot.jurisdiction || '',
      election: [ballot.electionName, ballot.electionDate].filter(Boolean).join(' '),
      isJudicial: !!race.isJudicial
    });
    cache[key] = data;
    if(activeKey === key) renderDossier(cand, race, data.result, data.cached);
    var el = document.querySelector('.cand[data-key="' + key + '"] .peek');
    if(el) el.innerHTML = t('cand.researched');
  }catch(e){
    if(activeKey === key) renderDossierError(cand, race, ri, ci, e.message);
  }
}

/* ---------------- ballot measures ---------------- */

async function selectMeasure(ri){
  var race = ballot.races[ri];
  var key = 'm:' + ri;
  activeKey = key;
  markActive(key);
  openDossier();

  if(cache[key]){
    renderMeasureDossier(ri, cache[key].result, cache[key].cached);
    return;
  }

  $('dossierContent').innerHTML = measureHead(race, null) +
    '<div class="d-loading"><div class="oval-anim"></div>' +
    '<p>' + t('load.measure') + '</p>' +
    '<p style="margin-top:8px">' + t('load.measure2') + '</p></div>';

  try{
    var data = await research({
      name: race.office,
      office: 'Ballot measure',
      jurisdiction: ballot.jurisdiction || '',
      election: [ballot.electionName, ballot.electionDate].filter(Boolean).join(' '),
      isJudicial: false,
      isMeasure: true,
      summary: race.summary || ''
    });
    cache[key] = data;
    if(activeKey === key) renderMeasureDossier(ri, data.result, data.cached);
    var el = document.querySelector('.cand[data-key="' + ri + ':0"] .peek');
    var el2 = document.querySelector('.cand[data-key="' + ri + ':1"] .peek');
    if(el) el.innerHTML = t('cand.researched');
    if(el2) el2.innerHTML = t('cand.researched');
  }catch(e){
    if(activeKey === key){
      $('dossierContent').innerHTML = measureHead(race, null) +
        '<div class="d-error">' + t('err.failed', {msg: esc(e.message)}) +
        '<br><button onclick="selectMeasure(' + ri + ')">' + t('btn.retry') + '</button></div>';
    }
  }
}

function funderRows(list){

function sideList(list, emptyMsg){
  if(!list || !list.length) return '<p style="font-size:13.5px;color:var(--ink-soft)">' + emptyMsg + '</p>';
  return list.map(function(e){
    return '<div class="endo"><div class="eorg">' + esc(e.name) + '</div>' +

  }).join('');

function renderMeasureDossier(ri, r, cached){
  var race = ballot.races[ri];
  var html = measureHead(race, cached) + measureVoteBar(ri, race) + '<div class="dossier-body">';

  if(r.summary){
    html += '<div class="dsec"><p style="font-size:14px;line-height:1.55">' + esc(r.summary) + '</p>' + summarySourcesHtml(r) + '</div>';
  }

  var fin = r.financing || {};
  html += '<div class="dsec"><h4>' + t('sec.financing') + '</h4>' +
    '<div class="fin-side">' + t('fin.yes') + '</div>' + funderRows(fin.support) +
    '<div class="fin-side">' + t('fin.no') + '</div>' + funderRows(fin.oppose);
  if(fin.note) html += '<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px">' + esc(fin.note) + '</p>';
  html += '</div>';

  html += '<div class="dsec"><h4>' + t('sec.supporters') + '</h4>' + sideList(r.supporters, t('none.support')) + '</div>';
  html += '<div class="dsec"><h4>' + t('sec.opponents') + '</h4>' + sideList(r.opponents, t('none.oppose')) + '</div>';

  if(r.sources && r.sources.length){
    html += '<div class="dsec"><h4>' + t('sec.sources') + '</h4><p class="srcs">' +
      r.sources.map(linkifySource).join(' · ') + '</p></div>';
  }
  html += '<p class="disclaimer">' + t('disc.measure') + (r._translated ? ' ' + t('disc.translated') : '') + '</p>';
  html += '</div>';
  $('dossierContent').innerHTML = html;
  $('dossier').scrollTop = 0;
}

/* ---------------- dossier rendering ---------------- */

function openDossier(){ $('dossier').classList.add('open'); $('dossierEmpty').style.display='none'; $('dossier').scrollTop = 0; }
function closeDossier(){ $('dossier').classList.remove('open'); }

function dossierHead(cand, race, cached){
  return '<div class="dossier-head">' +
    '<div class="eyebrow">' + t('head.cand') + '</div>' +
    '<h2>' + esc(cand.name) + '</h2>' +
    '<div class="office">' + esc(officeOf(ballot.races.indexOf(race))) + (cand.party ? ' · ' + esc(cand.party) : '') + '</div>' +
    (cached === true ? '<span class="cachebadge">' + t('badge.cached') + '</span>' :
     cached === false ? '<span class="cachebadge">' + t('badge.fresh') + '</span>' : '') +
    '<button class="dossier-close" onclick="closeDossier()">' + t('btn.close') + '</button>' +
    '</div>';
}

function voteBar(ri, ci){
  var isVoted = votes[ri] === ci;
  var race = ballot.races[ri];
  var otherPick = (votes[ri] !== undefined && votes[ri] !== ci) ? race.candidates[votes[ri]] : null;
  var html = '<div class="votebar">';
  if(isVoted){
    html += '<button class="unmark" onclick="toggleVote(' + ri + ',' + ci + ')">' + t('vote.remove') + '</button>';
  } else {
    html += '<button class="mark" onclick="toggleVote(' + ri + ',' + ci + ')">' + t('vote.add') + '</button>';
    if(otherPick){
      html += '<div class="swapnote">' + t('vote.replaces', {name: esc(otherPick.name)}) + '</div>';
    }
  }
  html += '</div>';
  return html;
}

function retentionVoteBar(ri){
  var sel = votes[ri];
  return '<div class="votebar">' +
    '<p style="font-size:14px;line-height:1.5;margin-bottom:10px"><strong>' + t('ret.question', {name: esc(candName(ri, 0))}) + '</strong><br>' +
    t('ret.note', {name: esc(candName(ri, 0))}) + '</p>' +
    '<div class="mv-row">' +
    '<button class="' + (sel === 'yes' ? 'unmark' : 'mark') + '" onclick="toggleVote(' + ri + ',\'yes\')">' +
      (sel === 'yes' ? '✓ ' : '') + t('ret.yes') + '</button>' +
    '<button class="' + (sel === 'no' ? 'unmark' : 'mark') + '" onclick="toggleVote(' + ri + ',\'no\')">' +
      (sel === 'no' ? '✓ ' : '') + t('ret.no') + '</button>' +
    '</div><div class="swapnote">' + (sel === undefined ? t('mv.mark') : t('mv.unmark')) + '</div></div>';
}

function renderDossierLoading(cand, race){
  $('dossierContent').innerHTML = dossierHead(cand, race, null) +
    '<div class="d-loading"><div class="oval-anim"></div>' +
    '<p>' + t('load.cand') + (race.isJudicial ? t('load.fedsoc') : '') + '</p>' +
    '<p style="margin-top:8px">' + t('load.cand2') + '</p></div>';
}

function renderDossierError(cand, race, ri, ci, msg){
  $('dossierContent').innerHTML = dossierHead(cand, race, null) +
    '<div class="d-error">' + t('err.failed', {msg: esc(msg)}) +
    '<br><button onclick="selectCandidate(' + ri + ',' + ci + ')">' + t('btn.retry') + '</button></div>';
}

// Sources behind the AI-written description. Only real https links are shown.
function summarySourcesHtml(r){
  var s = (r.summarySources || []).filter(function(x){ return x && /^https:\/\//i.test(x.url || ''); }).slice(0, 4);
  if(!s.length) return '';
  return '<p class="sumsrc">' + t('sum.sources') + ' ' + s.map(function(x){
    return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name || t('src')) + ' ↗</a>';
  }).join(' · ') + '</p>';
}

// Only plain https links ever become clickable: research text comes from the open web, and a
// javascript: or data: URL in it would run on this page for everyone who opens that dossier.
function safeUrl(url){
  var u = String(url || '').trim();
  return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
}
// The site a link points to, so voters can see whether a claim comes from a newspaper or a blog.
function hostOf(url){
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch(e){ return ''; }
}
function srcLink(url){
  var u = safeUrl(url);
  if(!u) return '';
  var h = hostOf(u);
  return ' <a class="srclink" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + (h ? esc(h) : t('src')) + ' ↗</a>';
}

function linkifySource(sname){
  var t = String(sname||'').trim();
  var m = t.match(/^(?:https?:\/\/)?([a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s()]*)?)$/i);
  if(m){
    var href = t.indexOf('http') === 0 ? t : 'https://' + t;
    return '<a class="srclink" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(t) + '</a>';
  }
  return esc(t);
}

function fmtAmount(a){
  var t = String(a||'').trim();
  if(!t) return '';
  if(/undisclosed|not disclosed/i.test(t)) return T('amt.undisclosed');
  if(/unknown|unavailable|not available|not found/i.test(t)) return T('amt.na');
  if(t.length > 18) return t.slice(0, 18) + '…';
  return t;
}

var TAG_DEFS = [
  [/^left$/i, 'left'], [/^right$/i, 'right'], [/^nonpartisan$/i, 'np'],
  [/donation platform|conduit/i, 'platform'], [/super\s*pac/i, 'super'],
  [/nonconnected\s*pac/i, 'noncon'], [/connected\s*pac/i, 'con'],
  [/party/i, 'party'], [/candidate committee/i, 'candcom'], [/pac|committee/i, 'pac'],
  [/corp/i, 'corp'], [/individual/i, 'indiv'], [/self.?funded/i, 'self'],
  [/union|labor/i, 'union'], [/lobby|trade|industry/i, 'lobby'], [/nonprofit/i, 'nonprofit'],
  [/law enforcement|police/i, 'police'], [/newspaper|editorial/i, 'editorial'],
  [/business association|chamber/i, 'business'], [/environment/i, 'env'],
  [/religious/i, 'religious'], [/civil rights/i, 'civil'],
  [/professional association|bar association/i, 'prof'], [/elected official/i, 'official']
];
// The canonical (English) category of a tag, e.g. 'pac'. Null when no known category matches.
function tagKey(txt){
  for(var i = 0; i < TAG_DEFS.length; i++) if(TAG_DEFS[i][0].test(txt)) return TAG_DEFS[i][1];
  return null;
}

// Definition shown when a tag is tapped. Looks up the tag's English category (data-k),
// so it works whatever language the label is displayed in.
function tagDef(tagEl){
  var raw = tagEl.getAttribute('data-k') || tagEl.textContent.trim();
  var k = tagKey(raw);
  if(k) return [T('tag.' + k + '.l'), T('tag.' + k + '.d')];
  return [tagEl.textContent.trim(), T('tag.default')];
}

function showTagPop(tagEl){
  var pop = $('tagpop');
  var d = tagDef(tagEl);
  pop.innerHTML = '<div class="tp-title">' + esc(d[0]) + '</div><div class="tp-body">' + esc(d[1]) + '</div>';
  pop.style.display = 'block';
  var r = tagEl.getBoundingClientRect();
  var pw = Math.min(290, window.innerWidth - 16);
  pop.style.maxWidth = pw + 'px';
  var left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8));
  var top = r.bottom + 8;
  if(top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function hideTagPop(){ $('tagpop').style.display = 'none'; }

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.tag') : null;
  if(t && !t.classList.contains('amtchip')){
    e.stopPropagation();
    showTagPop(t);
    return;
  }
  if(!(e.target.closest && e.target.closest('#tagpop'))) hideTagPop();
});
window.addEventListener('scroll', hideTagPop, true);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideTagPop(); });

// Donor/funder kind tag. Shows the translated category name when the kind is a known
// category, otherwise the server-translated text (kindTr), otherwise the original.
function kindTag(kind, kindTr){
  var s = String(kind||'').trim();
  if(!s) return '';
  var l = s.toLowerCase();
  var cls = 'tag group';
  if(/pac|committee/.test(l)) cls = 'tag kind kpac';
  else if(/corp/.test(l)) cls = 'tag kind kcorp';
  else if(/individual/.test(l)) cls = 'tag kind kindiv';
  var k = tagKey(s);
  var label = LANG === 'en' ? s : (k ? T('tag.' + k + '.l') : (kindTr || s));
  return '<span class="' + cls + '" data-k="' + esc(s) + '">' + esc(label) + '</span>';
}
// Group-type tag on endorsements, ratings, supporters (free text from research).
function groupTag(e){
  if(!e.type) return '';
  var k = tagKey(e.type);
  var label = LANG === 'en' ? e.type : (k ? T('tag.' + k + '.l') : (e.type_tr || e.type));
  return '<span class="tag group" data-k="' + esc(e.type) + '">' + esc(label) + '</span>';
}

function leanTag(lean){
  var l = String(lean||'').toLowerCase();
  if(l==='left') return '<span class="tag left" data-k="left">' + t('lean.left') + '</span>';
  if(l==='right') return '<span class="tag right" data-k="right">' + t('lean.right') + '</span>';
  return '<span class="tag nonpartisan" data-k="nonpartisan">' + t('lean.nonpartisan') + '</span>';
}

function renderDossier(cand, race, r, cached){
  var ri = -1, ci = -1;
  if(activeKey){
    var parts = activeKey.split(':');
    ri = parseInt(parts[0],10); ci = parseInt(parts[1],10);
  }
  var html = dossierHead(cand, race, cached);
  if(ri >= 0) html += race.isRetention ? retentionVoteBar(ri) : voteBar(ri, ci);
  html += '<div class="dossier-body">';

  if(r.summary){
    html += '<div class="dsec"><p style="font-size:14px;line-height:1.55">' + esc(r.summary) + '</p>' + summarySourcesHtml(r) + '</div>';
  }

  if(race.isJudicial && r.federalistSociety){
    var fs = r.federalistSociety;
    var status = fs.status || 'none_found';
    var label = status==='documented' ? t('fs.documented')
              : status==='possible'   ? t('fs.possible')
              : t('fs.none');
    html += '<div class="dsec"><h4>' + t('sec.judicial') + '</h4>' +
      '<div class="fedsoc' + (status==='none_found' ? ' none' : '') + '">' +
      '<div class="fstatus">' + label + '</div>';
    if(fs.evidence && fs.evidence.length){
      html += '<ul>' + fs.evidence.map(function(ev){
        return '<li>' + esc(ev.summary) +
        '<span class="src">' + esc(ev.source||'') +
        (safeUrl(ev.url) ? ' · <a href="' + esc(safeUrl(ev.url)) + '" target="_blank" rel="noopener noreferrer">' + (esc(hostOf(ev.url)) || t('src')) + '</a>' : '') +
        '</span></li>';
      }).join('') + '</ul>';
    } else if(status==='none_found'){
      html += '<p style="font-size:13px;margin-top:8px">' + t('fs.noneText') + '</p>';
    }
    html += '</div></div>';
  }

  var fedRace = ri >= 0 && isFederalRace(race);
  if(fedRace) html += '<div class="dsec" id="moneySec"></div>';

  html += '<div class="dsec"><h4>' + t('sec.donors') + '</h4>';
  if(r.donors && r.donors.length){
    html += r.donors.map(function(d){
      // WinRed / ActBlue process online donations; they are not PACs giving their own money
      if(/\bact\s*blue\b|\bwin\s*red\b/i.test(d.name||'')) d.type = 'online donation platform';
      if(/^committee$/i.test(d.type||'')){   // results cached before the server-side fix
        var s = String(d.name||'').toUpperCase();
        d.type = /\b(REPUBLICAN|DEMOCRATIC|LIBERTARIAN)\b.*\b(COMMITTEE|PARTY)\b|\bPARTY\b/.test(s) ? 'party committee'
               : /\bFOR (SENATE|CONGRESS|PRESIDENT|AMERICA|FLORIDA)\b|\bFRIENDS OF\b|\bVICTORY FUND\b/.test(s) ? 'candidate committee' : 'PAC';
      }
      return '<div class="donor-row"><div><span class="dname">' + esc(d.name) + '</span>' +
      '<span class="dtype">' + kindTag(d.type, d.type_tr) + srcLink(d.url) + '</span></div>' +
      '<span class="damt">' + esc(fmtAmount(d.amount)) + '</span></div>';
    }).join('');
  } else {
    var official = /^(Not registered with the FEC|No itemized contributions reported)/.test(r.donorDataNote_en || r.donorDataNote || '');
    html += '<p style="font-size:13.5px;color:var(--ink-soft)">' + (official ? t('donors.noFec') : t('donors.none')) + '</p>';
  }
  if(r.donorDataNote) html += '<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px">' + esc(r.donorDataNote) + '</p>';
  var listUrl = r.donorListUrl || '';
  if(!listUrl){   // federal results cached before this field existed: rebuild from the committee ID in the note
    var cm = String(r.donorDataNote||'').match(/committee (C\d{8})/);
    if(cm && r.donors && r.donors.length) listUrl = 'https://www.fec.gov/data/receipts/?committee_id=' + cm[1];
  }
  if(/^https:\/\//i.test(listUrl))
    html += '<a class="fulllist" href="' + esc(listUrl) + '" target="_blank" rel="noopener">' + t('donors.full') + ' &#8599;</a>';
  html += '</div>';

  html += '<div class="dsec"><h4>' + t('sec.endorse') + '</h4>';
  if(r.endorsements && r.endorsements.length){
    html += r.endorsements.map(function(e){
      return '<div class="endo"><div class="eorg">' + esc(e.org) + '</div>' +
      (e.note ? '<div class="enote">' + esc(e.note) + '</div>' : '') +
      '<div class="tagrow">' + leanTag(e.lean) +
      groupTag(e) +
      srcLink(e.url) +
      '</div></div>';
    }).join('');
  } else {
    html += '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('endorse.none') + '</p>';
  }
  html += '</div>';

  // drop grades from voter-guide / tracker sites; keep only org scorecards and bar/official reviews
  var JUNK_RATER = /decode\s*the\s*vote|ballotpedia|isidewith|vote\s*smart|votesmart|ballotready|independent evaluation|voter guide|aggregator|election tracker/i;
  if(r.ratings) r.ratings = r.ratings.filter(function(e){ return !JUNK_RATER.test((e.org||'') + ' ' + (e.type||'') + ' ' + (e.type_en||'')); });
  if(r.ratings && r.ratings.length){
    html += '<div class="dsec"><h4>' + t('sec.ratings') + '</h4>' +
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t('ratings.sub') + '</p>';
    html += r.ratings.map(function(e){
      return '<div class="endo"><div class="eorg">' + esc(e.org) +
      (e.rating ? ' <span class="ratingval">' + esc(e.rating) + '</span>' : '') + '</div>' +
      (e.note ? '<div class="enote">' + esc(e.note) + '</div>' : '') +
      '<div class="tagrow">' + leanTag(e.lean) +
      groupTag(e) +
      srcLink(e.url) +
      '</div></div>';
    }).join('');
    html += '</div>';
  }

  if(r.sources && r.sources.length){
    html += '<div class="dsec"><h4>' + t('sec.sources') + '</h4><p class="srcs">' +
      r.sources.map(linkifySource).join(' · ') + '</p></div>';
  }
  html += '<p class="disclaimer">' + t('disc.cand') + (r._translated ? ' ' + t('disc.translated') : '') + '</p>';

  html += '</div>';
  $('dossierContent').innerHTML = html;
  $('dossier').scrollTop = 0;
  if(fedRace) loadRaceMoney(ri, cand);
}

/* ---------------- money in this race (FEC) ---------------- */

// U.S. Senate and House only: the FEC covers them; state and local races file elsewhere.
function isFederalRace(race){
  var o = String(race && race.office || '').toLowerCase();
  return /\b(united states|u\.?s\.?)\s+senat/.test(o) ||
    /representative in congress|congressional district|\b(united states|u\.?s\.?)\s+representative/.test(o);
}

var moneyCache = {};   // raceIndex -> response (or a pending promise)
var MONEY_BUCKETS = [
  { k:'small', c:'#2F6B3C', group:'grass' },
  { k:'mid',   c:'#A9C2AF' },
  { k:'large', c:'#D08A2B', group:'big' },
  { k:'pac',   c:'#8A3F12', group:'big' },
  { k:'party', c:'#7C8597' },
  { k:'self',  c:'#C9C1AE' }
];

function fmtUsd(n){
  n = Math.round(n || 0);
  if(n >= 1e6) return '$' + (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if(n >= 1e4) return '$' + Math.round(n/1e3) + 'K';
  return '$' + n.toLocaleString('en-US');
}
function fmtPct(part, whole){
  if(!whole) return '0%';
  var p = part / whole * 100;
  return (p > 0 && p < 1 ? '&lt;1' : Math.round(p)) + '%';
}

async function loadRaceMoney(ri, cand){
  var race = ballot.races[ri];
  var box = $('moneySec');
  if(!box) return;
  var hit = moneyCache[ri];
  if(hit && !hit.then){ renderRaceMoney(ri, cand, hit); return; }
  box.innerHTML = '<h4>' + t('sec.money') + '</h4><p class="mny-note">' + t('mny.loading') + '</p>';
  try{
    if(!hit){
      hit = moneyCache[ri] = api('/api/race-money', {
        office: race.office,
        names: race.candidates.map(function(c){ return c.name; })
      });
    }
    var data = await hit;
    moneyCache[ri] = data;
    renderRaceMoney(ri, cand, data);
  }catch(e){
    delete moneyCache[ri];
    var b = $('moneySec');
    if(b && activeKey && parseInt(activeKey.split(':')[0],10) === ri)
      b.innerHTML = '<h4>' + t('sec.money') + '</h4><p class="mny-note">' + t('mny.err') + '</p>';
  }
}

function renderRaceMoney(ri, cand, d){
  var box = $('moneySec');
  // the visitor may have opened another dossier while this loaded
  if(!box || !activeKey || parseInt(activeKey.split(':')[0],10) !== ri) return;
  if(!d || !d.available){ box.remove(); return; }
  var me = null;
  d.candidates.forEach(function(c){ if(c.name === cand.name) me = c; });
  var html = '<h4>' + t('sec.money') + '</h4>';
  var link = function(u){ return /^https:\/\/www\.fec\.gov\//.test(u || '') ? u : ''; };

  if(!me){
    html += '<p class="mny-lead">' + t('mny.none', {name: esc(cand.name)}) + '</p>';
  } else if(!me.receipts){
    html += '<p class="mny-lead">' + t('mny.zero', {name: esc(cand.name)}) + '</p>';
  } else {
    html += '<p class="mny-lead">' + t('mny.lead', {name: '<strong>' + esc(cand.name) + '</strong>',
      amt: '<strong>' + fmtUsd(me.receipts) + '</strong>', pct: fmtPct(me.receipts, d.raceTotal), total: fmtUsd(d.raceTotal)}) + '</p>';
  }

  // Bar 1: the race, one segment per candidate on the ballot
  if(d.raceTotal > 0){
    var sorted = d.candidates.slice().sort(function(a, b){ return b.receipts - a.receipts; });
    var before = 0;
    html += '<div class="mny-label">' + t('mny.race', {total: fmtUsd(d.raceTotal)}) + '</div><div class="mny-bar">';
    sorted.forEach(function(c){
      if(!c.receipts) return;
      if(me && c.name !== me.name && sorted.indexOf(c) < sorted.indexOf(me)) before += c.receipts;
      var u = link(c.links && c.links.all);
      var tip = esc(c.name) + ': ' + fmtUsd(c.receipts) + ' (' + fmtPct(c.receipts, d.raceTotal) + ')';
      html += (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"' : '<span') +
        ' class="rc' + (c === me ? ' me' : '') + '" style="flex-grow:' + c.receipts + '" title="' + tip + '" aria-label="' + tip + '">' +
        (u ? '</a>' : '</span>');
    });
    html += '</div><div class="mny-key">';
    sorted.forEach(function(c){
      var u = link(c.links && c.links.all);
      var label = esc(c.name) + ' ' + fmtUsd(c.receipts) + ' &middot; ' + fmtPct(c.receipts, d.raceTotal);
      html += u ? '<a class="' + (c === me ? 'me' : '') + '" href="' + esc(u) + '" target="_blank" rel="noopener">' + label + '</a>'
                : '<span>' + label + '</span>';
    });
    html += '</div>';
    // dashed bracket from this candidate's slice down to the zoomed-in bar
    if(me && me.receipts){
      html += '<div class="mny-zoom"><div style="left:' + (before / d.raceTotal * 100) + '%;width:' +
        Math.max(1, me.receipts / d.raceTotal * 100) + '%"></div></div>';
    }
  }

  // Bar 2: where this candidate's money came from
  var bd = me && me.breakdown;
  if(me && me.receipts && bd){
    var total = MONEY_BUCKETS.reduce(function(s, b){ return s + (bd[b.k] || 0); }, 0) || me.receipts;
    html += '<div class="mny-label">' + t('mny.cand', {name: esc(cand.name), amt: fmtUsd(me.receipts)}) + '</div><div class="mny-bar">';
    MONEY_BUCKETS.forEach(function(b){
      var v = bd[b.k] || 0;
      if(v <= 0) return;
      var u = link(me.links && me.links[b.k]);
      var tip = t('mny.' + b.k).replace(/<[^>]+>/g, '') + ': ' + fmtUsd(v) + ' (' + fmtPct(v, total).replace('&lt;', '<') + ')';
      html += (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"' : '<span') +
        ' style="flex-grow:' + v + ';background:' + b.c + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        (u ? '</a>' : '</span>');
    });
    html += '</div><div style="margin-top:6px">';
    MONEY_BUCKETS.forEach(function(b){
      var v = bd[b.k] || 0;
      if(v <= 0) return;
      var u = link(me.links && me.links[b.k]);
      var inner = '<span class="sw" style="background:' + b.c + '"></span>' +
        '<span class="ml">' + t('mny.' + b.k) + '</span>' +
        '<span class="mv">' + fmtUsd(v) + ' &middot; ' + fmtPct(v, total) + '</span>' +
        '<span class="mgo">' + (u ? t('mny.donors') + ' &#8599;' : '') + '</span>';
      html += u ? '<a class="mrow" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>'
                : '<div class="mrow">' + inner + '</div>';
    });
    html += '</div>';
    var grass = bd.small || 0, big = (bd.large || 0) + (bd.pac || 0);
    html += '<p class="mny-sum">' + t('mny.sum', {g: fmtPct(grass, total), b: fmtPct(big, total)}) + '</p>';
  }

  if(d.unmatched && d.unmatched.length)
    html += '<p class="mny-note">' + t('mny.unmatched', {names: d.unmatched.map(esc).join(', ')}) + '</p>';
  html += '<p class="mny-note">' + t('mny.note', {period: esc(d.period || ''), date: esc(d.coverageEnd || '')}) + '</p>';
  box.innerHTML = html;
}

/* countdown + registration triage */
function daysUntil(iso){
  return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
}

function renderCountdown(){
  var dReg = daysUntil(ELECTION.regDeadline);
  var dVote = daysUntil(ELECTION.date);
  var num = $('cdNum'), lab = $('cdLabel');
  if(dReg > 0){
    num.textContent = dReg;
    lab.innerHTML = t('cd.toReg', {days: dReg === 1 ? t('cd.day') : t('cd.days')}) + '<br><strong>' + t('election.name') + '</strong> · ' +
      t('cd.regDeadline', {date: new Date(ELECTION.regDeadline).toLocaleDateString(LANG === 'en' ? 'en-US' : LANG === 'es' ? 'es-US' : 'fr-HT', {month:'long', day:'numeric'})});
  } else if(dVote > 0){
    num.textContent = dVote;
    lab.innerHTML = t('cd.toVote', {days: dVote === 1 ? t('cd.day') : t('cd.days')}) + '<br><strong>' + t('election.name') + '</strong> · ' + t('cd.regClosed');
  } else {
    num.textContent = '\u2713';
    lab.innerHTML = '<strong>' + t('election.name') + '</strong> ' + t('cd.passed');
  }
}

  applyStatic(); renderCountdown(); renderResumeList(); renderVoteBar();

  if(ballot){
    cache = {};                       // research is fetched again in the new language (served from the shared cache)
    renderBallot();
    translateBallotInBackground();
    if(activeKey){

      if(parts[0] === 'm') selectMeasure(parseInt(parts[1], 10));
