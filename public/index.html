    return '<div class="bk-row"><div class="donor-row"><div><span class="dname">' + esc(f.name) + '</span>' +
      (f.occupation ? '<div class="enote" style="font-size:12px">' + esc(f.occupation) + (f.place ? ' · ' + esc(f.place) : '') + '</div>' : '') +
      '<span class="dtype">' + kindTag(f.type || f.kind) + disclosureTag(f) + srcLink(f.url) + '</span></div>' +
      '<span class="damt">' + esc(fmtShortUSD(b.total)) + '</span></div>' +
      '<ul class="bk-paths">' + b.paths.slice(0, 4).map(backerPath).join('') + '</ul></div>';
  }).join('');
}
function backerGroups(r, isMeasure){
  var groups = [];
  function take(list, end, n){
    byAmount(list || []).slice(0, n).forEach(function(d){
      if(!d || !d.name || BK_SKIP.test(d.name)) return;
      groups.push({name: String(d.name).replace(/\s*\(.*\)\s*$/, '').trim(), fecId: d.fecId, spent: d.amount, end: end});
    });
  }
  if(isMeasure){
    var fin = r.financing || {};
    take(fin.support, 'yes', 5); take(fin.oppose, 'no', 5);
  } else {
    var os = r.outsideSpending || {};
    take(os.support, 'for', 5); take(os.oppose, 'against', 5);
    // committees backing the candidate: their donors are already in the record, so no lookup needed
    var byCom = {};
    (r.committeeDonors || []).forEach(function(d){
      var c = String(d.committee || '').trim();
      if(!c) return;
      (byCom[c] = byCom[c] || []).push(d);
    });
    Object.keys(byCom).slice(0, 4).forEach(function(c){ groups.push({name: c, end: 'allied', funders: byCom[c]}); });
  }
  return groups;
}
function loadBackers(r, isMeasure){
  var sec = document.getElementById('backersSec');
  if(!sec) return;
  var groups = backerGroups(r, isMeasure);
  if(!groups.length){ sec.remove(); return; }
  var head = '<h4>' + t('sec.backers') + '</h4><p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t(isMeasure ? 'bk.subm' : 'bk.sub') + '</p>';
  sec.innerHTML = head + '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('bk.loading') + '</p>';
  // Two sides, traced separately, each under the same green / black headings as the rest of the page
  var help = groups.filter(function(g){ return g.end === 'for' || g.end === 'allied' || g.end === 'yes'; });
  var stop = groups.filter(function(g){ return g.end === 'against' || g.end === 'no'; });
  var none = '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('bk.none') + '</p>';
  Promise.all([help.length ? traceBackers(help) : null, stop.length ? traceBackers(stop) : null]).then(function(res){
    if(!document.body.contains(sec)) return;
    var h = head;
    if(res[0]) h += '<div class="fin-side side-yes">' + t(isMeasure ? 'bk.yesSide' : 'bk.help') + '</div><div class="bk-side bk-side-yes">' + (res[0].length ? backerRows(res[0]) : none) + '</div>';
    if(res[1]) h += '<div class="fin-side side-no">' + t(isMeasure ? 'bk.noSide' : 'bk.stop') + '</div><div class="bk-side bk-side-no">' + (res[1].length ? backerRows(res[1]) : none) + '</div>';
    sec.innerHTML = h + '<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px">' + t('bk.note') + '</p>';
  });
}
document.addEventListener('toggle', function(e){
  var el = e.target;
  if(el && el.matches && el.matches('details.og') && el.open) loadPanel(el);
}, true);

function srcLink(url, label){
  var u = safeUrl(url);
  if(!u) return '';
  var h = hostOf(u);
  return ' <a class="srclink" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + (label ? esc(label) : h ? esc(h) : t('src')) + ' ↗</a>';
}

function linkifySource(sname){
  var t = String(sname||'').trim();
  var m = t.match(/^(?:https?:\/\/)?([a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s()]*)?)$/i);
  if(m){
    var href = t.indexOf('http') === 0 ? t : 'https://' + t;
    return '<a class="srclink" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(t) + '</a>';
  }
  return esc(t);
}

function fmtAmount(a){
  var t = String(a||'').trim();
  if(!t) return '';
  if(/undisclosed|not disclosed/i.test(t)) return T('amt.undisclosed');
  if(/unknown|unavailable|not available|not found/i.test(t)) return T('amt.na');
  if(t.length > 18) return t.slice(0, 18) + '…';
  return t;
}

var TAG_DEFS = [
  [/^labortype$/i, 'labortype'], [/^notdisclosed$/i, 'notdisclosed'], [/^ownersnot$/i, 'ownersnot'], [/outside group/i, 'outsidegrp'],
  [/^left$/i, 'left'], [/^right$/i, 'right'], [/^nonpartisan$/i, 'np'], [/^press$/i, 'press'],
  [/donation platform|conduit/i, 'platform'], [/super\s*pac/i, 'super'],
  [/nonconnected\s*pac/i, 'noncon'], [/connected\s*pac/i, 'con'],
  [/party/i, 'party'], [/candidate committee/i, 'candcom'], [/pac|committee/i, 'pac'],
  [/corp/i, 'corp'], [/individual/i, 'indiv'], [/self.?funded/i, 'self'],
  [/union|labor/i, 'union'], [/lobby|trade|industry/i, 'lobby'], [/nonprofit/i, 'nonprofit'],
  [/law enforcement|police/i, 'police'], [/newspaper|editorial/i, 'editorial'],
  [/business association|chamber/i, 'business'], [/environment/i, 'env'],
  [/religious/i, 'religious'], [/civil rights/i, 'civil'],
  [/professional association|bar association/i, 'prof'], [/elected official/i, 'official']
];
// The canonical (English) category of a tag, e.g. 'pac'. Null when no known category matches.
function tagKey(txt){
  for(var i = 0; i < TAG_DEFS.length; i++) if(TAG_DEFS[i][0].test(txt)) return TAG_DEFS[i][1];
  return null;
}

// Definition shown when a tag is tapped. Looks up the tag's English category (data-k),
// so it works whatever language the label is displayed in.
function tagDef(tagEl){
  var raw = tagEl.getAttribute('data-k') || tagEl.textContent.trim();
  var k = tagKey(raw);
  if(k) return [T('tag.' + k + '.l'), T('tag.' + k + '.d')];
  return [tagEl.textContent.trim(), T('tag.default')];
}

function showTagPop(tagEl){
  var pop = $('tagpop');
  var d = tagDef(tagEl);
  pop.innerHTML = '<div class="tp-title">' + esc(d[0]) + '</div><div class="tp-body">' + esc(d[1]) + '</div>';
  pop.style.display = 'block';
  var r = tagEl.getBoundingClientRect();
  var pw = Math.min(290, window.innerWidth - 16);
  pop.style.maxWidth = pw + 'px';
  var left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8));
  var top = r.bottom + 8;
  if(top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function hideTagPop(){ $('tagpop').style.display = 'none'; }

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.tag') : null;
  if(t && !t.classList.contains('amtchip')){
    e.stopPropagation();
    showTagPop(t);
    return;
  }
  if(!(e.target.closest && e.target.closest('#tagpop'))) hideTagPop();
});
window.addEventListener('scroll', hideTagPop, true);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideTagPop(); });

// Donor/funder kind tag. Shows the translated category name when the kind is a known
// category, otherwise the server-translated text (kindTr), otherwise the original.
function kindTag(kind, kindTr){
  var s = String(kind||'').trim();
  if(!s) return '';
  var l = s.toLowerCase();
  var cls = 'tag group';
  if(/pac|committee/.test(l)) cls = 'tag kind kpac';
  else if(/corp/.test(l)) cls = 'tag kind kcorp';
  else if(/individual/.test(l)) cls = 'tag kind kindiv';
  var k = tagKey(s);
  var label = LANG === 'en' ? s : (k ? T('tag.' + k + '.l') : (kindTr || s));
  return '<span class="' + cls + '" data-k="' + esc(s) + '">' + esc(label) + '</span>';
}
// Group-type tag on endorsements, ratings, supporters (free text from research).
function groupTag(e){
  if(!e.type) return '';
  var k = tagKey(e.type);
  var label = LANG === 'en' ? e.type : (k ? T('tag.' + k + '.l') : (e.type_tr || e.type));
  return '<span class="tag group" data-k="' + esc(e.type) + '">' + esc(label) + '</span>';
}

function leanTag(lean, item){
  var l = String(lean||'').toLowerCase();
  // Labor unions get no left/right label: show the kind of workers they represent instead.
  if(l==='labor'){
    var lt = item && item.laborType ? (LANG === 'en' ? item.laborType : (item.laborType_tr || item.laborType)) : '';
    return lt ? '<span class="tag group" data-k="labortype">' + esc(lt) + '</span>' : '';
  }
  if(l==='left') return '<span class="tag left" data-k="left">' + t('lean.left') + '</span>';
  if(l==='right') return '<span class="tag right" data-k="right">' + t('lean.right') + '</span>';
  if(l==='press') return '<span class="tag nonpartisan" data-k="press">' + t('lean.press') + '</span>';   // newspapers: no lean label
  return '<span class="tag nonpartisan" data-k="nonpartisan">' + t('lean.nonpartisan') + '</span>';
}

function renderDossier(cand, race, r, cached){
  var ri = -1, ci = -1;
  if(activeKey){
    var parts = activeKey.split(':');
    ri = parseInt(parts[0],10); ci = parseInt(parts[1],10);
  }
  var html = dossierHead(cand, race, cached);
  if(ri >= 0) html += race.isRetention ? retentionVoteBar(ri) : voteBar(ri, ci);
  html += '<div class="dossier-body">';

  if(r.summary){
    html += '<div class="dsec"><p style="font-size:14px;line-height:1.55">' + esc(r.summary) + '</p>' + summarySourcesHtml(r) + '</div>';
  }

  if(race.isJudicial && r.federalistSociety){
    var fs = r.federalistSociety;
    var status = fs.status || 'none_found';
    var label = status==='documented' ? t('fs.documented')
              : status==='possible'   ? t('fs.possible')
              : t('fs.none');
    html += '<div class="dsec"><h4>' + t('sec.judicial') + '</h4>' +
      '<div class="fedsoc' + (status==='none_found' ? ' none' : '') + '">' +
      '<div class="fstatus">' + label + '</div>';
    if(fs.evidence && fs.evidence.length){
      html += '<ul>' + fs.evidence.map(function(ev){
        return '<li>' + esc(ev.summary) +
        '<span class="src">' + esc(ev.source||'') +
        (safeUrl(ev.url) ? ' · <a href="' + esc(safeUrl(ev.url)) + '" target="_blank" rel="noopener noreferrer">' + (esc(hostOf(ev.url)) || t('src')) + '</a>' : '') +
        '</span></li>';
      }).join('') + '</ul>';
    } else if(status==='none_found'){
      html += '<p style="font-size:13px;margin-top:8px">' + t('fs.noneText') + '</p>';
    }
    html += '</div></div>';
  }

  var fedRace = ri >= 0 && isFederalRace(race);
  if(fedRace) html += '<div class="dsec" id="moneySec"></div>';
  html += '<div class="dsec" id="localSec"></div>';

  html += '<div class="dsec"><h4>' + t('sec.donors') + '</h4>';
  if(r.donors && r.donors.length){
    html += r.donors.map(function(d){
      // WinRed / ActBlue process online donations; they are not PACs giving their own money
      if(/\bact\s*blue\b|\bwin\s*red\b/i.test(d.name||'')) d.type = 'online donation platform';
      if(/^committee$/i.test(d.type||'')){   // results cached before the server-side fix
        var s = String(d.name||'').toUpperCase();
        d.type = /\b(REPUBLICAN|DEMOCRATIC|LIBERTARIAN)\b.*\b(COMMITTEE|PARTY)\b|\bPARTY\b/.test(s) ? 'party committee'
               : /\bFOR (SENATE|CONGRESS|PRESIDENT|AMERICA|FLORIDA)\b|\bFRIENDS OF\b|\bVICTORY FUND\b/.test(s) ? 'candidate committee' : 'PAC';
      }
      return '<div class="donor-row"><div><span class="dname">' + esc(d.name) + '</span>' +
      (d.note ? '<div class="enote" style="font-size:12px">' + esc(d.note) + '</div>' : '') +
      '<span class="dtype">' + kindTag(d.type, d.type_tr) + disclosureTag(d) + srcLink(d.url, d.srcLabel) + '</span></div>' +
      '<span class="damt">' + esc(fmtAmount(d.amount)) + '</span>' +
      (isOrgEntry(d, d.type) ? orgDetails(d) : '') + '</div>';
    }).join('');
  } else {
    var official = /^(Not registered with the FEC|No itemized contributions reported)/.test(r.donorDataNote_en || r.donorDataNote || '');
    var hasCommittee = r.committeeDonors && r.committeeDonors.length;
    html += '<p style="font-size:13.5px;color:var(--ink-soft)">' + (official ? t('donors.noFec') : hasCommittee ? t('donors.committeeOnly') : t('donors.none')) + '</p>';
  }
  if(r.officialMiss && !r.donorSource) html += '<div class="cov-box">' + t('donors.noMatch', {src: esc(r.officialMiss)}) + '</div>';
  if(r.donorDataNote) html += '<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px">' + esc(r.donorDataNote) + '</p>';
  html += coverageBox(race);
  var listUrl = r.donorListUrl || '';
  if(!listUrl){   // federal results cached before this field existed: rebuild from the committee ID in the note
    var cm = String(r.donorDataNote||'').match(/committee (C\d{8})/);
    if(cm && r.donors && r.donors.length) listUrl = 'https://www.fec.gov/data/receipts/?committee_id=' + cm[1];
  }
  if(/^https:\/\//i.test(listUrl))
    html += '<a class="fulllist" href="' + esc(listUrl) + '" target="_blank" rel="noopener">' + t('donors.full') + ' &#8599;</a>';
  html += '</div>';
  if(ri >= 0 && !fedRace && !race.isMeasure) html += '<div class="dsec" id="tiesSec" hidden></div>';

  // Money given to political committees backing the candidate. Not campaign donations:
  // committees take unlimited amounts, campaigns are capped.
  if(r.committeeDonors && r.committeeDonors.length){
    html += '<div class="dsec"><h4>' + t('sec.committee') + '</h4>' +
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t('committee.sub') + '</p>';
    // Grouped by the committee that received the money: what it is, what it raised, what it gave this
    // campaign, then its donors with dates. Rows with no committee named go last, flagged.
    var comOrder = [], byCom = {};
    r.committeeDonors.forEach(function(d){
      var c = String(d.committee || '').trim(), k = c.toLowerCase();
      if(!byCom[k]){ byCom[k] = {name: c, rows: []}; comOrder.push(k); }
      byCom[k].rows.push(d);
    });
    comOrder.sort(function(a, b){ return (a === '') - (b === ''); });
    comOrder.forEach(function(k){
      var g = byCom[k];
      var meta = (r.alliedCommittees || []).filter(function(m){ return String(m.name||'').toLowerCase() === k; })[0];
      html += '<div class="al-com">';
      if(g.name){
        html += '<div class="al-head"><div class="al-label">' + t('al.to') + '</div><span class="dname">' + esc(g.name) + '</span>';
        var facts = [];
        if(meta && meta.type) facts.push(esc(meta.type) + (meta.status ? ' · ' + esc(meta.status) : ''));
        if(meta && meta.raised) facts.push(t('al.raised', {amt: fmtShortUSD(meta.raised), n: meta.gifts || 0}));
        if(facts.length) html += '<p class="al-facts">' + facts.join('<br>') + '</p>';
        html += '<p class="al-spent">' + (meta && meta.gaveCampaign ? t('al.gave', {amt: esc(fmtAmount(meta.gaveCampaign))}) : meta ? t('al.gaveNone') : '') +
          (meta ? ' <span class="al-sub">' + t('al.spendNote') + '</span>' : '') + '</p>';
        html += orgDetails({name: g.name}) + '</div>';
      } else {
        html += '<div class="al-head al-unk"><div class="al-label">' + t('al.unnamed') + '</div><p class="al-sub">' + t('al.unnamedNote') + '</p></div>';
      }
      html += g.rows.map(function(d){
        var when = d.last ? (d.gifts > 1 && d.first && d.first !== d.last
          ? t('al.dates', {n: d.gifts, first: fmtDay(d.first), last: fmtDay(d.last)})
          : t('al.date', {date: fmtDay(d.last)})) : (g.name ? '' : '');
        return '<div class="donor-row"><div><span class="dname">' + esc(d.name) + '</span>' +
        (d.occupation ? '<div class="enote" style="font-size:12px">' + esc(d.occupation) + (d.place ? ' · ' + esc(d.place) : '') + '</div>' : '') +
        (when ? '<div class="enote al-when">' + when + '</div>' : (!d.source ? '<div class="enote al-when">' + t('al.nodate') + '</div>' : '')) +
        '<span class="dtype">' + kindTag(d.type, d.type_tr) + disclosureTag(d) + (d.source ? '' : srcLink(d.url)) + '</span></div>' +
        '<span class="damt">' + esc(fmtAmount(d.amount)) + '</span>' +
        (isOrgEntry(d, d.type) ? orgDetails(d) : '') + '</div>';
      }).join('');
      html += '</div>';
    });
    html += '</div>';
  }

  // Outside spending: groups spending on their own for or against the candidate. Shown only when
  // the result has the section (results researched before it existed don't, until they refresh).
  if(r.outsideSpending){
    var os = r.outsideSpending, osFor = os.support || [], osAg = os.oppose || [];
    html += '<div class="dsec"><h4>' + t('sec.outside') + '</h4>' +
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t('outside.sub') + '</p>';
    if(osFor.length) html += '<div class="fin-side side-yes">' + t('outside.for') + '</div>' + outsideRows(osFor);
    if(osAg.length) html += '<div class="fin-side side-no">' + t('outside.against') + '</div>' + outsideRows(osAg);
    if(!osFor.length && !osAg.length) html += '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('outside.none') + '</p>';
    if(os.note) html += '<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px">' + esc(os.note) + '</p>';
    if(/^https:\/\//i.test(os.listUrl || ''))
      html += '<a class="fulllist" href="' + esc(os.listUrl) + '" target="_blank" rel="noopener">' + t('outside.full') + ' &#8599;</a>';
    html += '</div>';
  }

  // Biggest backers: after the campaign's donors and outside spending
  if(r.outsideSpending || (r.committeeDonors && r.committeeDonors.length)) html += '<div class="dsec" id="backersSec"></div>';

  html += '<div class="dsec"><h4>' + t('sec.endorse') + '</h4>';
  if(r.endorsements && r.endorsements.length){
    html += editorialFirst(r.endorsements).map(function(e){
      return '<div class="endo"><div class="eorg">' + esc(e.org) + '</div>' +
      (e.note ? '<div class="enote">' + esc(e.note) + '</div>' : '') +
      '<div class="tagrow">' + leanTag(e.lean, e) +
      groupTag(e) +
      srcLink(e.url) +
      '</div></div>';
    }).join('');
  } else {
    html += '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('endorse.none') + '</p>';
  }
  html += '</div>';

  if(r.opposition && r.opposition.length){
    html += '<div class="dsec"><h4>' + t('sec.oppose') + '</h4>' +
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t(race.isRetention ? 'oppose.subRet' : 'oppose.sub') + '</p>';
    html += r.opposition.map(function(e){
      return '<div class="endo"><div class="eorg">' + esc(e.org) + '</div>' +
      (e.note ? '<div class="enote">' + esc(e.note) + '</div>' : '') +
      '<div class="tagrow">' + leanTag(e.lean, e) +
      groupTag(e) +
      srcLink(e.url) +
      '</div></div>';
    }).join('');
    html += '</div>';
  }

  // drop grades from voter-guide / tracker sites; keep only org scorecards and bar/official reviews
  var JUNK_RATER = /decode\s*the\s*vote|ballotpedia|isidewith|vote\s*smart|votesmart|ballotready|independent evaluation|voter guide|aggregator|election tracker/i;
  if(r.ratings) r.ratings = r.ratings.filter(function(e){ return !JUNK_RATER.test((e.org||'') + ' ' + (e.type||'') + ' ' + (e.type_en||'')); });
  if(r.ratings && r.ratings.length){
    html += '<div class="dsec"><h4>' + t('sec.ratings') + '</h4>' +
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t('ratings.sub') + '</p>';
    html += r.ratings.map(function(e){
      return '<div class="endo"><div class="eorg">' + esc(e.org) +
      (e.rating ? ' <span class="ratingval">' + esc(e.rating) + '</span>' : '') + '</div>' +
      (e.note ? '<div class="enote">' + esc(e.note) + '</div>' : '') +
      '<div class="tagrow">' + leanTag(e.lean, e) +
      groupTag(e) +
      srcLink(e.url) +
      '</div></div>';
    }).join('');
    html += '</div>';
  }

  if(r.sources && r.sources.length){
    html += '<div class="dsec"><h4>' + t('sec.sources') + '</h4><p class="srcs">' +
      r.sources.map(linkifySource).join(' · ') + '</p></div>';
  }
  html += '<p class="disclaimer">' + t('disc.cand') + (r._translated ? ' ' + t('disc.translated') + (r._partialTranslation ? ' ' + t('disc.partial') : '') : '') + (r.researchedAt ? ' ' + t('disc.date', {d: esc(fmtDay(r.researchedAt))}) : '') + '</p>' + reportBox();

  html += '</div>';
  $('dossierContent').innerHTML = html;
  if(r.outsideSpending) loadGroups();
  loadBackers(r, false);
  localResult = r;
  renderLocal(fedRace ? undefined : null);
  $('dossier').scrollTop = 0;
  if(fedRace) loadRaceMoney(ri, cand);
  if(ri >= 0 && !fedRace && !race.isMeasure) loadTies(ri, cand);
}

// Newspaper editorial boards lead the endorsement list; everything else keeps its order.
var EDITORIAL_RE = /\beditorial board\b|\b(miami herald|el nuevo herald|sun sentinel|palm beach post|tampa bay times|orlando sentinel|tallahassee democrat|florida times[- ]union|miami today|biscayne times|miami new times|miami times)\b/i;
function editorialFirst(list){
  var ed = [], rest = [];
  list.forEach(function(e){ (e && EDITORIAL_RE.test((e.org || '') + ' ' + (e.note || '')) ? ed : rest).push(e); });
  return ed.concat(rest);
}

/* ---------------- how local is the money ---------------- */

// Two panels: money supporting the candidate (campaign donations plus outside spending to help) and
// money opposing them (outside spending to defeat). Each splits people from groups and shades by where
// the address on the filing is. The server does the counting; see LOCAL_VERSION in worker.js.
var localResult = null;
var LOCAL_RINGS = [
  { k:'here', c:'#2F6B3C' },
  { k:'mdc',  c:'#74A27F' },
  { k:'fl',   c:'#B9D0BE' },
  { k:'out',  c:'#D08A2B' },
  { k:'unk',  c:'', cls:'loc-unk' }
];
function locSum(o){ var n = 0; for(var k in o) n += o[k] || 0; return n; }
function locMerge(a, b){   // same scope only
  if(!a) return b; if(!b) return a;
  if(a.kind !== b.kind || a.place !== b.place) return a;
  var m = JSON.parse(JSON.stringify(a));
  ['people','groups'].forEach(function(k){ for(var r in b[k]) m[k][r] = (m[k][r] || 0) + (b[k][r] || 0); });
  m.self = (m.self || 0) + (b.self || 0);
  m.total = (m.total || 0) + (b.total || 0);
  return m;
}
function locPanel(L, side, emptyMsg){
  var h = '<div class="loc-side"><div class="fin-side ' + (side === 'for' ? 'side-yes' : 'side-no') + '">' + t(side === 'for' ? 'loc.for' : 'loc.against') + '</div>' +
    '<p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:0 0 8px">' + t(side === 'for' ? 'loc.forSub' : 'loc.againstSub') + '</p>';
  if(!L || !L.total){ return h + '<p style="font-size:13.5px;color:var(--ink-soft)">' + emptyMsg + '</p></div>'; }
  var used = {};
  // One block per kind of giver. The bar is 100% of that money WITH an address on file, so the
  // percentages printed on it and under it are the same numbers; money with no address is stated
  // in words below the bar instead of drawn into it.
  ['people','groups','outside'].forEach(function(k){
    var o = L[k] || {}, tot = locSum(o);
    if(tot <= 0) return;
    var unk = o.unk || 0, known = tot - unk;
    h += '<div class="loc-row"><div class="loc-head"><span>' + t('loc.' + k) + '</span><span class="lv">' + fmtShortUSD(tot) + '</span></div>';
    if(known <= 0){
      h += '<div class="loc-bar"><span class="loc-unk" style="flex-grow:1"></span></div><p class="loc-cap">' + t('loc.allUnk') + '</p></div>';
      used.unk = 1;
      return;
    }
    var parts = [];
    h += '<div class="loc-bar">';
    LOCAL_RINGS.forEach(function(g){
      if(g.k === 'unk') return;
      var v = o[g.k] || 0;
      if(v <= 0) return;
      used[g.k] = 1;
      var pct = fmtPct(v, known), name = locRingLabel(L, g.k);
      parts.push('<b style="color:' + g.c + '">&#9632;</b> ' + pct + ' ' + name.charAt(0).toLowerCase() + name.slice(1));
      var big = v / known >= 0.12;
      h += '<span style="flex-grow:' + v + ';background:' + g.c + '" title="' + esc(pct.replace('&lt;','<') + ' ' + name.replace(/<[^>]+>/g, '')) + '">' +
        (big ? '<em class="' + (g.k === 'fl' ? 'dk' : '') + '">' + pct + '</em>' : '') + '</span>';
    });
    h += '</div><p class="loc-cap">' + parts.join(' &middot; ') + '</p>';
    if(unk > 0) h += '<p class="loc-cap loc-cap-unk">' + t('loc.noAddr', {amt: fmtShortUSD(unk)}) + '</p>';
    h += '</div>';
  });
  if(L.self > 0) h += '<p class="loc-cap" style="margin-top:4px"><strong>' + t('loc.self') + ':</strong> ' + fmtShortUSD(L.self) + '</p>';
  return h + '</div>';
}
function locRingLabel(L, k){
  if(k !== 'here') return t('loc.' + k);
  return L.kind === 'state' || !L.exact ? t('loc.herePlace', {place: esc(L.place)}) : t('loc.here');
}
// fed: undefined while the FEC totals load, null when the race isn't federal, else that candidate's local tally
function renderLocal(fed){
  var sec = $('localSec'), r = localResult;
  if(!sec || !r) return;
  var os = r.outsideSpending || null;
  var isFed = fed !== null;
  if(isFed && fed === undefined){ sec.innerHTML = '<h4>' + t('sec.local') + '</h4><p class="mny-note">' + t('loc.loading') + '</p>'; return; }
  var campaign = isFed ? fed : (r.localMoney && r.localMoney.total ? r.localMoney : null);
  // Outside spending stays its own row ("Outside groups"): one super PAC buy shouldn't swamp the
  // groups that gave to the campaign, and the two are placed by different kinds of address.
  var withOutside = function(base, o){
    if(!o || !o.total) return base;
    var b = base ? JSON.parse(JSON.stringify(base)) : {kind: o.kind, place: o.place, exact: o.exact, people: {}, groups: {}, self: 0, total: 0};
    b.outside = o.groups; b.total = (b.total || 0) + o.total;
    return b;
  };
  var support = withOutside(campaign, os && os.localFor);
  var against = withOutside(null, os && os.localAgainst);
  if(!support && !against && !isFed){
    sec.innerHTML = '<h4>' + t('sec.local') + '</h4><p style="font-size:13.5px;color:var(--ink-soft)">' + t('loc.noData') + '</p>';
    return;
  }
  var html = '<h4>' + t('sec.local') + '</h4><p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:-4px 0 10px">' + t('loc.sub') + '</p>';
  html += locPanel(support, 'for', t('donors.none'));
  html += locPanel(against, 'against', isFed ? t('loc.noAgainstFed') : t('loc.noAgainstLocal'));
  var L = support || against, notes = [];
  if(L && !L.exact) notes.push(L.kind === 'city' ? t('loc.notePlaceCity', {place: esc(L.place)}) : t('loc.notePlace', {place: esc(L.place)}));
  if(L && L.kind === 'city') notes.push(t('loc.noteCity'));
  if(isFed) notes.push(t('loc.noteFed'));
  notes.push(t('loc.noteGroups'));
  html += '<p class="mny-note">' + notes.join(' ') + '</p>';
  sec.innerHTML = html;
}

/* ---------------- money in this race (FEC) ---------------- */

// U.S. Senate and House only: the FEC covers them; state and local races file elsewhere.
// "Donors and official actions": hand-checked actions on items naming a candidate's donors
// (/data/donor-actions.json) and, from official reports, donors who gave to more than one candidate.
var ACTIONS = null, actionsWait = [];
try { fetch('/data/donor-actions.json').then(function(r){ return r.json(); }).then(function(j){
  ACTIONS = j; var w = actionsWait; actionsWait = []; w.forEach(function(f){ f(); });
}).catch(function(){ ACTIONS = {actions: []}; var w = actionsWait; actionsWait = []; w.forEach(function(f){ f(); }); }); } catch(e){ ACTIONS = {actions: []}; }
var sharedCache = {};   // request key -> response (or a pending promise)
function normName(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
// same rule as the server's donorKey: "Alpine Towing d/b/a Galactic" = "ALPINE TOWING", "Foo, Inc." = "foo"
function giverKey(n){
  var s = normName(String(n || '').replace(/\b(d\s*\/\s*b\s*\/\s*a|dba)\b.*$/i, ''));
  for(var i = 0; i < 3; i++) s = s.replace(/\s(inc|incorporated|llc|l l c|corp|corporation|co|company|pa|p a|pllc|pl|ltd|lp|llp|lllp)$/, '');
  return s.replace(/^the\s/, '').trim();
}
// ballot name vs. the name in the file: same last word, same first initial
function sameCand(a, b){
  var x = normName(String(a).replace(/["“”][^"“”]*["“”]/g, ' ')).split(' '), y = normName(b).split(' ');
  return x.length && y.length && x[x.length-1] === y[y.length-1] && x[0].charAt(0) === y[0].charAt(0);
}
// Whether the candidate holds a seat on the body this race is for. null = not checked for this race.
function officeStatus(cand, race){
  if(!ACTIONS || !ACTIONS.checked) return null;
  var o = String(race.office || '');
  var re = function(p){ try { return new RegExp(p, 'i').test(o); } catch(e){ return false; } };
  if(!ACTIONS.checked.some(re)) return null;
  var h = (ACTIONS.officeholders || []).filter(function(x){ return re(x.match) && sameCand(cand.name, x.candidate); })[0];
  return h ? h : {status: 'none'};
}
function actionsFor(cand, race){
  if(!ACTIONS || !ACTIONS.actions) return [];
  return ACTIONS.actions.filter(function(a){
    try { if(!new RegExp(a.match, 'i').test(race.office || '')) return false; } catch(e){ return false; }
    return sameCand(cand.name, a.candidate);
  }).sort(function(a, b){ return String(b.date).localeCompare(String(a.date)); });
}
// The city for a city race ("Doral - Councilmember - Seat 2" -> "Doral"); '' for county and state races
function raceCity(race){
  var m = String(race && race.office || '').match(/^\s*([^-–]+?)\s*[-–]\s+\S/);
  return m && !/^(county|state|school|united|representative|justice|judge|circuit)/i.test(m[1]) ? m[1].trim() : '';
}
function tiesPeers(ri){
  var race = ballot.races[ri], city = raceCity(race);
  var list = city ? ballot.races.filter(function(r){ return !r.isMeasure && !r.isRetention && raceCity(r).toLowerCase() === city.toLowerCase(); }) : [race];
  return { city: city, races: list.map(function(r){ return { office: r.office, names: r.candidates.map(function(c){ return c.name; }) }; }) };
}
function tiesActive(ri, cand){
  return $('tiesSec') && activeKey && parseInt(activeKey.split(':')[0],10) === ri && ballot.races[ri].candidates.some(function(c){ return c.name === cand.name; });
}
function loadTies(ri, cand){
  if(!ACTIONS){ actionsWait.push(function(){ loadTies(ri, cand); }); return; }
  var race = ballot.races[ri], acts = actionsFor(cand, race), peers = tiesPeers(ri);
  var nNames = peers.races.reduce(function(n, r){ return n + r.names.length; }, 0);
  if(nNames < 2){ renderTies(ri, cand, acts, null, false); return; }
  var key = JSON.stringify(peers.races);
  var hit = sharedCache[key];
  if(hit && !hit.then){ renderTies(ri, cand, acts, hit, false, peers.city); return; }
  renderTies(ri, cand, acts, null, true, peers.city);
  if(!hit) hit = sharedCache[key] = api('/api/shared-donors', { races: peers.races });
  hit.then(function(d){ sharedCache[key] = d; if(tiesActive(ri, cand)) renderTies(ri, cand, acts, d, false, peers.city); })
     .catch(function(){ delete sharedCache[key]; if(tiesActive(ri, cand)) renderTies(ri, cand, acts, {error: true}, false, peers.city); });
}
function usd(n){ return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function seatLabel(office, city){
  var parts = String(office || '').split(/\s+[-–]\s+/);
  return city && parts.length > 1 ? parts[parts.length - 1] : String(office || '');
}
function renderTies(ri, cand, acts, shared, loading, city){
  var box = $('tiesSec');
  if(!box) return;
  var ok = shared && shared.available && !shared.error;
  var groups = ok ? (shared.groups || []) : [];
  var me = function(b){ return sameCand(cand.name, b.name) && (!b.office || b.office === ballot.races[ri].office); };
  var mine = groups.filter(function(g){ return g.by.some(me); });
  var others = groups.filter(function(g){ return !g.by.some(me); });
  var meFound = ok && (shared.candidates || []).some(function(c){ return c.found && me(c); });
  var st = officeStatus(cand, ballot.races[ri]);
  if(!acts.length && !loading && !(ok && meFound) && !st){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  var h = '<h4>' + t('sec.ties') + '</h4><p class="ties-sub">' + t('ties.sub') + '</p>';
  if(st && !acts.length){
    var nm = esc(cand.name), body = esc(st.body || '');
    h += '<p class="tie-status">' + (st.status === 'none' ? t('ties.notIn', {name: nm})
      : st.status === 'former' ? t('ties.former', {name: nm, body: body})
      : st.reviewed ? t('ties.currentNone', {name: nm, body: body}) : t('ties.current', {name: nm, body: body})) + '</p>';
  }
  if(acts.length){
    h += '<div class="fin-side">' + t('ties.actions', {name: esc(cand.name)}) + '</div>';
    h += acts.map(function(a){
      var v = a.votes || {}, out = [];
      out.push('<strong>' + t(a.passed ? 'ties.passed' : 'ties.failed') + '</strong>' +
        (v.yes && v.no ? ' ' + v.yes.length + '-' + v.no.length : '') +
        (v.unanimous ? ', ' + t('ties.unan') : '') + (v.consent ? ', ' + t('ties.consent') : ''));
      if(v.no && v.no.length) out.push(t('ties.yes') + ': ' + esc(v.yes.join(', ')) + ' &middot; ' + t('ties.no') + ': ' + esc(v.no.join(', ')));
      if(v.absent && v.absent.length) out.push(t('ties.absent') + ': ' + esc(v.absent.join(', ')));
      var title = (a.title && (a.title[LANG] || a.title.en)) || '';
      var ctx = a.context ? (a.context[LANG] || a.context.en) : '';
      var donors = (a.donors || []).map(function(d){
        var dn = d.name && typeof d.name === 'object' ? (d.name[LANG] || d.name.en) : d.name;
        var line = '<div class="tie-donor"><span class="dname">' + esc(dn) + '</span> ' + t('ties.gave', {amt: usd(d.amount), date: fmtDay(d.date)});
        if(ok && meFound){
          var k = giverKey(d.key || dn);
          var g = mine.filter(function(g){ return [g.label].concat(g.others || []).some(function(n){ var gk = giverKey(n); return gk === k || (k.length > 4 && gk.indexOf(k) >= 0); }); })[0];
          var also = g ? g.by.filter(function(b){ return !me(b); }).map(function(b){ return esc(b.name); }) : [];
          line += '<div class="enote">' + (also.length ? t('ties.also', {names: also.join(', ')}) : t('ties.alsoNone')) + '</div>';
        }
        return line + '</div>';
      }).join('');
      return '<div class="tie-act"><div class="tie-when">' + esc(fmtDay(a.date)) + ' &middot; ' + esc(a.body || '') + '</div>' +
        '<div class="tie-title">' + esc(title) + '</div>' +
        '<div class="tie-vote">' + out.join('<br>') + '</div>' +
        '<div class="tie-roles">' + (a.role || []).map(function(r){ return '<span class="tie-role">' + t('role.' + r) + '</span>'; }).join('') + '</div>' +
        donors + (ctx ? '<p class="enote">' + esc(ctx) + '</p>' : '') +
        '<div class="dtype">' + srcLink(a.url, T('ties.record')) + srcLink(a.donorUrl, T('ties.report')) + '</div></div>';
    }).join('');
  }
  if(loading) h += '<p class="mny-note">' + t('ties.loading') + '</p>';
  else if(shared && shared.error) h += '<p class="mny-note">' + t('ties.err') + '</p>';
  else if(ok && meFound){
    h += '<div class="fin-side">' + t('ties.shared') + '</div><p class="ties-sub">' + (city ? t('ties.scopeCity', {city: esc(city)}) : t('ties.scopeRace')) + '</p>';
    var row = function(g){
      var by = g.by.slice().sort(function(a, b){ return me(b) - me(a) || b.amount - a.amount; }).map(function(b){
        var seat = seatLabel(b.office, city), mark = me(b);
        return '<span class="tie-gift' + (mark ? ' me' : '') + '">' + esc(b.name) + (shared.candidates.length > 2 && seat && seat !== b.office ? ' <span class="tie-seat">' + esc(seat) + '</span>' : '') + ' ' + usd(b.amount) + '</span>';
      }).join('');
      var extra = (g.others || []).length ? '<details class="tie-addr"><summary>' + t('ties.sameAddr', {n: g.others.length + (g.more || 0)}) + '</summary>' + esc(g.others.join('; ')) + (g.more ? '…' : '') + '</details>' : '';
      return '<div class="donor-row"><div><span class="dname">' + esc(g.label) + '</span>' + extra + '<div class="tie-gifts">' + by + '</div></div><span class="damt">' + usd(g.total) + '</span></div>';
    };
    if(!mine.length && !others.length) h += '<p style="font-size:13.5px;color:var(--ink-soft)">' + t('ties.noneShared') + '</p>';
    var first = mine.concat(others), show = first.slice(0, 10), rest = first.slice(10);
    h += show.map(row).join('');
    if(rest.length) h += '<details class="tie-more"><summary>' + t('ties.more', {n: first.length}) + '</summary>' + rest.map(row).join('') + '</details>';
    var miss = (shared.candidates || []).filter(function(c){ return !c.found; }).map(function(c){ return esc(c.name); });
    if(miss.length) h += '<p class="ties-note">' + t('ties.missing', {names: miss.join(', ')}) + '</p>';
    h += '<p class="ties-note">' + t('ties.method', {date: esc(fmtDay(shared.asOf))}) + '</p>';
  }
  box.innerHTML = h;
}

function isFederalRace(race){
  var o = String(race && race.office || '').toLowerCase();
  return /\b(united states|u\.?s\.?)\s+senat/.test(o) ||
    /representative in congress|congressional district|\b(united states|u\.?s\.?)\s+representative/.test(o);
}

var moneyCache = {};   // raceIndex -> response (or a pending promise)
var MONEY_BUCKETS = [
  { k:'small', c:'#2F6B3C', group:'grass' },
  { k:'mid',   c:'#A9C2AF' },
  { k:'large', c:'#D08A2B', group:'big' },
  { k:'pac',   c:'#8A3F12', group:'big' },
  { k:'party', c:'#7C8597' },
  { k:'self',  c:'#C9C1AE' }
];

function fmtUsd(n){
  n = Math.round(n || 0);
  if(n >= 1e6) return '$' + (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if(n >= 1e4) return '$' + Math.round(n/1e3) + 'K';
  return '$' + n.toLocaleString('en-US');
}
function fmtPct(part, whole){
  if(!whole) return '0%';
  var p = part / whole * 100;
  return (p > 0 && p < 1 ? '&lt;1' : Math.round(p)) + '%';
}

async function loadRaceMoney(ri, cand){
  var race = ballot.races[ri];
  var box = $('moneySec');
  if(!box) return;
  var hit = moneyCache[ri];
  if(hit && !hit.then){ renderRaceMoney(ri, cand, hit); return; }
  box.innerHTML = '<h4>' + t('sec.money') + '</h4><p class="mny-note">' + t('mny.loading') + '</p>';
  try{
    if(!hit){
      hit = moneyCache[ri] = api('/api/race-money', {
        office: race.office,
        names: race.candidates.map(function(c){ return c.name; })
      });
    }
    var data = await hit;
    moneyCache[ri] = data;
    renderRaceMoney(ri, cand, data);
  }catch(e){
    delete moneyCache[ri];
    var b = $('moneySec');
    if(b && activeKey && parseInt(activeKey.split(':')[0],10) === ri){
      b.innerHTML = '<h4>' + t('sec.money') + '</h4><p class="mny-note">' + t('mny.err') + '</p>';
      renderLocal(false);
    }
  }
}

function renderRaceMoney(ri, cand, d){
  var box = $('moneySec');
  // the visitor may have opened another dossier while this loaded
  if(!box || !activeKey || parseInt(activeKey.split(':')[0],10) !== ri) return;
  if(!d || !d.available){ box.remove(); renderLocal(false); return; }
  var me = null;
  d.candidates.forEach(function(c){ if(c.name === cand.name) me = c; });
  renderLocal(me && me.local ? me.local : false);
  var html = '<h4>' + t('sec.money') + '</h4>';
  var link = function(u){ return /^https:\/\/www\.fec\.gov\//.test(u || '') ? u : ''; };

  if(!me){
    html += '<p class="mny-lead">' + t('mny.none', {name: esc(cand.name)}) + '</p>';
  } else if(!me.receipts){
    html += '<p class="mny-lead">' + t('mny.zero', {name: esc(cand.name)}) + '</p>';
  }

  // Where this candidate's money came from
  var bd = me && me.breakdown;
  if(me && me.receipts && bd){
    var total = MONEY_BUCKETS.reduce(function(s, b){ return s + (bd[b.k] || 0); }, 0) || me.receipts;
    // largest share first, in the bar (left to right) and the list (top to bottom); colors stay fixed per source
    var ranked = MONEY_BUCKETS.filter(function(b){ return (bd[b.k] || 0) > 0; })
      .sort(function(a, b){ return (bd[b.k] || 0) - (bd[a.k] || 0); });
    html += '<div class="mny-label">' + t('mny.cand', {name: esc(cand.name), amt: fmtUsd(me.receipts)}) + '</div><div class="mny-bar">';
    ranked.forEach(function(b){
      var v = bd[b.k] || 0;
      if(v <= 0) return;
      var u = link(me.links && me.links[b.k]);
      var tip = t('mny.' + b.k).replace(/<[^>]+>/g, '') + ': ' + fmtUsd(v) + ' (' + fmtPct(v, total).replace('&lt;', '<') + ')';
      html += (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"' : '<span') +
        ' style="flex-grow:' + v + ';background:' + b.c + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        (u ? '</a>' : '</span>');
    });
    html += '</div><div style="margin-top:6px">';
    ranked.forEach(function(b){
      var v = bd[b.k] || 0;
      if(v <= 0) return;
      var u = link(me.links && me.links[b.k]);
      var inner = '<span class="sw" style="background:' + b.c + '"></span>' +
        '<span class="ml">' + t('mny.' + b.k) + '</span>' +
        '<span class="mv">' + fmtUsd(v) + ' &middot; ' + fmtPct(v, total) + '</span>' +
        '<span class="mgo">' + (u ? t('mny.donors') + ' &#8599;' : '') + '</span>';
      html += u ? '<a class="mrow" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>'
                : '<div class="mrow">' + inner + '</div>';
    });
    html += '</div>';
    var grass = bd.small || 0, big = (bd.large || 0) + (bd.pac || 0);
    html += '<p class="mny-sum">' + t('mny.sum', {g: fmtPct(grass, total), b: fmtPct(big, total)}) + '</p>';
  }

  if(d.unmatched && d.unmatched.length)
    html += '<p class="mny-note">' + t('mny.unmatched', {names: d.unmatched.map(esc).join(', ')}) + '</p>';
  html += '<p class="mny-note">' + t('mny.note', {period: esc(d.period || ''), date: esc(d.coverageEnd || '')}) + ' ' + t('mny.approx') + '</p>';
  box.innerHTML = html;
}

var dz = $('dropzone');
['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('dragover'); }); });

/* countdown + registration triage */
function daysUntil(iso){
  return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
}

function renderCountdown(){
  var dReg = daysUntil(ELECTION.regDeadline);
  var dVote = daysUntil(ELECTION.date);
  var num = $('cdNum'), lab = $('cdLabel');
  if(dReg > 0){
    num.textContent = dReg;
    lab.innerHTML = t('cd.toReg', {days: dReg === 1 ? t('cd.day') : t('cd.days')}) + '<br><strong>' + t('election.name') + '</strong> · ' +
      t('cd.regDeadline', {date: new Date(ELECTION.regDeadline).toLocaleDateString(LANG === 'en' ? 'en-US' : LANG === 'es' ? 'es-US' : 'fr-HT', {month:'long', day:'numeric'})});
  } else if(dVote > 0){
    num.textContent = dVote;
    lab.innerHTML = t('cd.toVote', {days: dVote === 1 ? t('cd.day') : t('cd.days')}) + '<br><strong>' + t('election.name') + '</strong> · ' + t('cd.regClosed');
  } else {
    num.textContent = '\u2713';
    lab.innerHTML = '<strong>' + t('election.name') + '</strong> ' + t('cd.passed');
  }
}

/* ---------------- language ---------------- */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.langs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.lang === LANG);
    b.setAttribute('aria-pressed', b.dataset.lang === LANG ? 'true' : 'false');
  });
}
async function setLang(l){
  if(l === LANG) return;
  LANG = l;
  try{ localStorage.setItem('ballot305.lang', l); }catch(e){}
  applyStatic(); renderCountdown(); renderResumeList(); renderVoteBar();
  $('planToggle').innerHTML = $('planView').classList.contains('open') ? t('plan.hide') : t('plan.view');
  if(ballot){
    cache = {};                       // research is fetched again in the new language (served from the shared cache)
    renderBallot();
    translateBallotInBackground();
    if(activeKey){
      var parts = activeKey.split(':');
      if(parts[0] === 'm') selectMeasure(parseInt(parts[1], 10));
      else selectCandidate(parseInt(parts[0], 10), parseInt(parts[1], 10));
    }
  }
}
document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click', function(){ setLang(b.dataset.lang); });
});
applyStatic();

renderCountdown();

/* ---------------- vote banner: early voting + Election Day polling place ---------------- */
// All times are Miami (America/New_York). Early voting: Oct 19 - Nov 1, 7am-7pm at all 28 county sites.
// Election Day: Nov 3, 7am-7pm at the voter's assigned precinct polling place.
var VOTE = { evStart:'2026-10-19', evEnd:'2026-11-01', eday:'2026-11-03', open:7, close:19,
  lookup:'https://www.voterfocus.com/VoterInformationLookup/voterSearch?county=FL-DAD' };
var evSites = null, myPlace = null, myPlaceFor = null;

function miamiNow(){
  var parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date());
  var o = {}; parts.forEach(function(p){ o[p.type] = p.value; });
  var hour = parseInt(o.hour, 10) % 24;
  return { date: o.year + '-' + o.month + '-' + o.day, hour: hour + parseInt(o.minute, 10) / 60 };
}
function addDays(iso, n){ var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function niceDay(iso){ return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric', timeZone:'UTC'}); }
function mapsDir(addr){ return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr); }

// Where are we in the voting calendar?
function votePhase(){
  var n = miamiNow(), d = n.date, h = n.hour;
  if(d < VOTE.evStart) return {kind:'pre-ev'};
  if(d <= VOTE.evEnd){
    if(h < VOTE.open) return {kind:'ev', status:'opens', when:'today'};
    if(h < VOTE.close) return {kind:'ev', status:'open'};
    if(d < VOTE.evEnd) return {kind:'ev', status:'opens', when:'tomorrow'};
    return {kind:'pre-eday'};
  }
  if(d < VOTE.eday) return {kind:'pre-eday'};
  if(d === VOTE.eday && h < VOTE.close) return {kind:'eday', status: h < VOTE.open ? 'opens' : 'open'};
  return {kind:'over'};
}

function evStatusLine(ph){
  if(ph.status === 'open') return {live:true, head:t('vb.open.head'), sub:t('vb.open.sub')};
  if(ph.when === 'today') return {live:false, head:t('vb.today.head'), sub:t('vb.later.sub')};
  return {live:false, head:t('vb.tomorrow.head'), sub:t('vb.later.sub')};
}

function renderVoteBar(){
  var bar = $('voteBar'), ph = votePhase(), html = '';
  var precinct = ballot && ballot.precinct ? ballot.precinct : '';
  if(ph.kind === 'over'){ bar.className = 'votenow'; bar.innerHTML = ''; return; }

  if(ph.kind === 'pre-ev' || ph.kind === 'ev'){
    var s = ph.kind === 'pre-ev'
      ? {live:false, head:t('vb.pre.head'), sub:t('vb.pre.sub')}
      : evStatusLine(ph);
    html = '<div class="vb-row"><div><div class="vb-kicker">' + t('vb.kicker.ev') + '</div>' +
      '<div class="vb-head">' + (s.live ? '<span class="live"></span>' : '') + s.head + '</div>' +
      '<div class="vb-sub">' + s.sub + '</div></div>' +
      '<button class="vb-btn" id="vbNearest" type="button">' + (ph.kind === 'ev' ? t('vb.btn.go') : t('vb.btn.find')) + ' &rarr;</button></div>' +
      '<div id="vbSites"></div>';
  } else {
    // Election Day (or the day before): your precinct polling place
    var head = ph.kind === 'pre-eday' ? t('vb.eve.head') :
      (ph.status === 'open' ? t('vb.polls.open') : t('vb.polls.opens'));
    var sub = ph.kind === 'eday' && ph.status === 'open' ? t('vb.eday.sub.open') : t('vb.eday.sub');
    html = '<div class="vb-kicker">' + t('vb.kicker.eday') + '</div>' +
      '<div class="vb-head">' + (ph.kind === 'eday' && ph.status === 'open' ? '<span class="live"></span>' : '') + head + '</div>' +
      '<div class="vb-sub">' + sub + '</div><div id="vbPlace"></div>';
  }
  bar.innerHTML = html;
  bar.className = 'votenow show';

  var nb = $('vbNearest');
  if(nb) nb.addEventListener('click', showNearestSites);
  if($('vbPlace')) renderMyPlace(precinct);
}

async function getEvSites(){
  if(evSites) return evSites;
  var r = await fetch('/api/evsites'); evSites = await r.json(); return evSites;
}
function milesBetween(a, b, c, d){
  var R = 3958.8, toR = Math.PI / 180, dLat = (c - a) * toR, dLon = (d - b) * toR;
  var x = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a*toR)*Math.cos(c*toR)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function siteRow(s, dist){
  var full = s.address + ', ' + s.city + ', FL ' + s.zip;
  return '<div class="vb-site"><div><div class="nm">' + esc(s.name) + '</div>' +
    '<div class="ad">' + esc(full) + '</div>' +
    (dist != null ? '<div class="dist">' + t('vb.miAway', {n: dist.toFixed(1)}) + '</div>' : '') + '</div>' +
    '<a class="vb-btn" href="' + esc(mapsDir(full)) + '" target="_blank" rel="noopener">' + t('vb.directions') + ' &#8599;</a></div>';
}
async function showNearestSites(){
  var box = $('vbSites');
  box.innerHTML = '<div class="vb-note">' + t('vb.finding') + '</div>';
  var data;
  try { data = await getEvSites(); } catch(e){ box.innerHTML = '<div class="vb-note">' + t('vb.loadFail') + ' <a href="' + esc(VOTE.lookup) + '" target="_blank" rel="noopener">' + t('vb.countyList') + ' &#8599;</a></div>'; return; }
  var sites = data.sites.slice();
  var finish = function(pos){
    var note = '';
    if(pos){
      var la = pos.coords.latitude, lo = pos.coords.longitude;
      sites.forEach(function(s){ s._d = (s.lat != null) ? milesBetween(la, lo, s.lat, s.lon) : null; });
      sites.sort(function(a, b){ return (a._d == null) - (b._d == null) || (a._d || 0) - (b._d || 0); });
    } else {
      sites.sort(function(a, b){ return a.name.localeCompare(b.name); });
      note = t('vb.locOff');
    }
    var top = pos ? sites.slice(0, 3) : sites;
    var html = '<div class="vb-sites">' + top.map(function(s){ return siteRow(s, pos ? s._d : null); }).join('') + '</div>';
    if(pos) html += '<button class="vb-btn ghost" id="vbAll" type="button" style="margin-top:12px">' + t('vb.allBtn') + '</button>';
    html += '<div class="vb-note">' + (note ? note + '<br>' : '') + t('vb.sameHours') + ' ' + t('vb.source') + ' <a href="' + esc(data.source) + '" target="_blank" rel="noopener">' + t('vb.sourceName') + ' &#8599;</a></div>';
    box.innerHTML = html;
    var all = $('vbAll');
    if(all) all.addEventListener('click', function(){
      box.querySelector('.vb-sites').innerHTML = sites.map(function(s){ return siteRow(s, s._d); }).join('');
      all.remove();
    });
  };
  if(!navigator.geolocation) return finish(null);
  navigator.geolocation.getCurrentPosition(finish, function(){ finish(null); }, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
}

// The precinct comes from reading the sample ballot, so a digit can be misread or the voter may have
// loaded someone else's ballot. Show it first and put the county's own lookup right next to it.
function precinctCheck(precinct){
  return '<div class="vb-pct"><div><div class="vb-kicker">' + t('vb.pctFrom') + '</div>' +
    '<div class="vb-pctnum">' + t('vb.pctNum', {p: esc(precinct)}) + '</div>' +
    '<div class="vb-note" style="margin-top:2px">' + t('vb.pctCheck') + '</div></div>' +
    '<a class="vb-btn" href="' + esc(VOTE.lookup) + '" target="_blank" rel="noopener">' + t('vb.pctBtn') + ' &#8599;</a></div>';
}
async function renderMyPlace(precinct){
  var box = $('vbPlace');
  var lookupLink = '<a href="' + esc(VOTE.lookup) + '" target="_blank" rel="noopener">' + t('vb.lookup') + ' &#8599;</a>';
  if(!precinct){
    box.innerHTML = '<div class="vb-note" style="font-size:12px">' + t('vb.noPrecinct') + ' ' + lookupLink + '</div>' +
      '<a class="vb-btn" style="margin-top:10px" href="' + esc(VOTE.lookup) + '" target="_blank" rel="noopener">' + t('vb.findMine') + ' &#8599;</a>';
    return;
  }
  try {
    if(myPlaceFor !== precinct){
      var r = await fetch('/api/pollingplace?p=' + encodeURIComponent(precinct));
      myPlace = r.ok ? await r.json() : null; myPlaceFor = precinct;
    }
  } catch(e){ myPlace = null; }
  if(!myPlace){
    box.innerHTML = precinctCheck(precinct) + '<div class="vb-note">' + t('vb.noMatch', {p: esc(precinct)}) + ' ' + lookupLink + '</div>';
    return;
  }
  var full = myPlace.address + ', ' + myPlace.city + ', FL ' + myPlace.zip;
  // Precinct first, read from the loaded ballot, with the county lookup to confirm it before the place.
  box.innerHTML = precinctCheck(precinct) + '<div class="vb-sites"><div class="vb-site"><div>' +
    '<div class="vb-kicker">' + t('vb.yourPlace', {p: esc(myPlace.precinct)}) + '</div>' +
    '<div class="nm" style="margin-top:4px">' + esc(myPlace.name) + '</div>' +
    '<div class="ad">' + esc(full) + '</div><div class="dist">' + t('vb.hours') + '</div></div>' +
    '<a class="vb-btn" href="' + esc(mapsDir(full)) + '" target="_blank" rel="noopener">' + t('vb.directions') + ' &#8599;</a></div></div>' +
    '<div class="vb-note">' + t('vb.official') + ' ' + lookupLink + '</div>';
}

renderVoteBar();
setInterval(renderVoteBarIfIdle, 5 * 60 * 1000);   // flip open/closed status as the day goes on
function renderVoteBarIfIdle(){ if(!$('vbSites') || !$('vbSites').innerHTML) renderVoteBar(); }

/* resume: list all saved ballot plans */
function renderResumeList(){
  var st = loadStore();
  var ids = Object.keys(st.ballots).sort(function(a,b){ return (st.ballots[b].ts||0) - (st.ballots[a].ts||0); });
  var box = $('resumeBox');
  if(!ids.length){ box.style.display = 'none'; return; }
  var html = '<p><strong>' + t('resume.title') + '</strong></p>';
  ids.forEach(function(id){
    var e = st.ballots[id];
    var decided = Object.keys(e.votes||{}).length;
    var label = [e.ballot.jurisdiction, e.ballot.electionName, e.ballot.electionDate].filter(Boolean).join(' · ') || T('resume.default');
    html += '<div class="resume-row">' +
      '<span class="rr-label">' + esc(label) + '<br><span class="rr-meta">' + t('resume.decided', {d: decided, t: e.ballot.races.length}) + '</span></span>' +
      '<span class="rr-actions"><button class="btn2" data-resume="' + esc(id) + '">' + t('resume.btn') + '</button>' +
      '<button class="rr-del" data-del="' + esc(id) + '" title="' + t('resume.del') + '">✕</button></span>' +
      '</div>';
  });
  html += '<p class="rr-meta" style="margin-top:8px">' + t('resume.shared') + ' <button type="button" class="rr-del" id="forgetAll" style="width:auto;padding:2px 8px">' + t('resume.forget') + '</button></p>';
  box.innerHTML = html;
  box.style.display = 'block';
  $('forgetAll').addEventListener('click', function(){
    if(!confirm(T('resume.forgetConfirm'))) return;
    try{ Object.keys(localStorage).forEach(function(k){ if(/^ballot305/.test(k)) localStorage.removeItem(k); }); }catch(e){}
    ballot = null; votes = {}; currentId = null; cache = {};
    renderResumeList();
    location.reload();
  });
  box.querySelectorAll('[data-resume]').forEach(function(b){
    b.addEventListener('click', function(){
      var e = loadStore().ballots[b.dataset.resume];
      if(!e) return;
      ballot = e.ballot;
      currentId = b.dataset.resume;
      moneyCache = {};
      votes = e.votes || {};
      normalizeBallot(ballot, votes);
      saveState();
      renderBallot();
      translateBallotInBackground();
    });
  });
  box.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      if(confirm(T('resume.confirm'))) deletePlan(b.dataset.del);
    });
  });
}
renderResumeList();
