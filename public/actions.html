  function link(u, txt){ return /^https:\/\//.test(u || '') ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(txt) + ' ↗</a>' : ''; }
  function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function titleCase(s){ return s.replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); }
  function sameCand(a, b){
    var x = norm(String(a).replace(/["“”][^"“”]*["“”]/g, ' ')).replace(/[^a-z0-9]+/g, ' ').trim().split(' '), y = norm(b).replace(/[^a-z0-9]+/g, ' ').trim().split(' ');
    return x[x.length-1] === y[y.length-1] && x[0].charAt(0) === y[0].charAt(0);
  }

  function build(){
    var d = DATA, places = {};
    function place(name, body){
      var k = slug(name);
      if(!places[k]) places[k] = {key: k, name: name, body: body || '', members: []};
      if(body && !places[k].body) places[k].body = body;
      return places[k];
    }
    (d.officeholders || []).forEach(function(o){
      var name = o.body === 'Miami-Dade County Commission' ? 'Miami-Dade County, District 5' : String(o.body).replace(SUFFIX, '');
      var p = place(name, o.body);
      var acts = (d.actions || []).filter(function(a){ return a.body === o.body && sameCand(o.candidate, a.candidate); })
        .sort(function(a, b){ return String(b.date).localeCompare(String(a.date)); });
      p.members.push({o: o, acts: acts});
    });
    // cities on the ballot with no incumbent in the list
    (d.checked || []).forEach(function(re){
      var m = String(re).match(/\(([^)]*\|[^)]*)\)/);
      if(!m) return;
      m[1].split('|').forEach(function(c){
        var name = NAMES[c] || titleCase(c.replace(/\\s\*|\?/g, ''));
        if(!places[slug(name)]) place(name, '');
      });
    });
    return Object.keys(places).map(function(k){ return places[k]; }).sort(function(a, b){
      var rank = function(n){ return /County/.test(n) ? 0 : /^Florida (House|Senate)/.test(n) ? 1 : 2; };
      var ra = rank(a.name), rb = rank(b.name);
      return ra !== rb ? ra - rb : a.name.localeCompare(b.name);
    });
  }

  function reg(d){
    var m = String(d || '').match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
    if(!m) return '';
    if(m[3]) return day(d);
    try { return new Date(+m[1], +m[2]-1, 1).toLocaleDateString(LANG === 'ht' ? 'fr' : LANG, {month:'short', year:'numeric'}); } catch(e){ return d; }
  }
  // registered lobbyists, grouped by firm and client, with the registry they come from
  function lobHtml(a){
    var list = a.lobbied || [];
    if(!list.length) return '';
    var groups = [], by = {}, used = [];
    list.forEach(function(l){
      var k = (l.firm || '') + '|' + (l.for || '') + '|' + (l.src || '');
      if(!by[k]){ by[k] = {firm: l.firm, client: l.for, src: l.src, names: [], regs: []}; groups.push(by[k]); }
      by[k].names.push(l.name); if(l.reg) by[k].regs.push(l.reg);
    });
    var rows = groups.map(function(g){
      var r = g.regs.slice().sort(), when = '';
      if(r.length){ var a0 = reg(r[0]), a1 = reg(r[r.length - 1]); when = t('lobReg', {date: esc(a0 === a1 ? a0 : a0 + ' – ' + a1)}); }
      if(g.src && g.src !== 'form' && used.indexOf(g.src) < 0) used.push(g.src);
      return '<div class="lob"><b>' + esc(g.names.join(', ')) + '</b>' + (g.firm ? ' (' + esc(g.firm) + ')' : '') + (g.client ? ' ' + t('lobFor', {client: esc(g.client)}) : '') +
        (g.src === 'form' ? ', ' + t('lobForm') : '') + (when ? ' · ' + when : '') + '</div>';
    }).join('');
    var R = (DATA && DATA.registries) || {};
    var links = used.map(function(k){ return R[k] ? link(R[k].url, L(R[k].name)) : ''; }).join('');
    return '<div class="lobs"><div class="lobh">' + t('lobbied') + '</div>' + rows + (links ? '<div class="links">' + links + '</div>' : '') + '</div>';
  }
  function actHtml(a){
    var v = a.votes || {}, out = [];
    var split = v.yes && v.no && v.no.length;
    out.push('<strong>' + (a.result ? esc(L(a.result)) : t(a.passed ? 'passed' : 'failed')) + '</strong>' + (split ? ' <span class="split">' + v.yes.length + '-' + v.no.length + '</span>' : '') +
      (v.unanimous ? ', ' + t('unan') : '') + (v.consent ? ', ' + t('consent') : ''));
    if(split) out.push(t('yes') + ': ' + esc(v.yes.join(', ')) + ' · ' + t('no') + ': ' + esc(v.no.join(', ')));
    if(v.absent && v.absent.length) out.push(t('absent') + ': ' + esc(v.absent.join(', ')));
    var donors = (a.donors || []).map(function(g){ return '<div class="donor"><b>' + esc(L(g.name)) + '</b> ' + t('gave', {amt: usd(g.amount), date: day(g.date)}) + '</div>'; }).join('');
    var ctx = L(a.context);
    var lob = lobHtml(a), noGift = (a.lobbied || []).length && !(a.donors || []).length ? '<p class="ctx">' + t('noGift', {name: esc(a.candidate)}) + '</p>' : '';
    return '<div class="act"><div class="when">' + esc(day(a.date)) + '</div><div class="ttl">' + esc(L(a.title)) + '</div>' +
      '<div class="vote">' + out.join('<br>') + '</div>' +
      '<div class="roles">' + (a.role || []).map(function(r){ return '<span class="role' + (r === 'no' ? ' no' : '') + '">' + t('role.' + r) + '</span>'; }).join('') + '</div>' +
      lob + donors + noGift + (ctx ? '<p class="ctx">' + esc(ctx) + '</p>' : '') +
      '<div class="links">' + link(a.url, t(a.kind === 'request' ? 'recordReq' : a.kind === 'bill' ? 'recordBill' : 'record')) + (a.voteUrls || []).map(function(u){ return link(u, t('rollCall')); }).join('') + (a.analysisUrl ? link(a.analysisUrl, t('analysis')) : '') + link(a.donorUrl, t('report')) + '</div></div>';
  }
  function memberHtml(m){
    var o = m.o, h = '<div class="member" data-search="' + esc(norm([o.candidate].concat(m.acts.map(function(a){
      return [L(a.title)].concat((a.donors || []).map(function(g){ return L(g.name); })).concat((a.lobbied || []).map(function(l){ return [l.name, l.firm, l.for].join(' '); })).join(' ');
    })).join(' '))) + '"><h3>' + esc(o.candidate) + '</h3>';
    if(m.acts.length){
      var seen = {}, sum = 0;
      m.acts.forEach(function(a){ (a.donors || []).forEach(function(g){ var k = norm(L(g.name)) + '|' + g.date + '|' + g.amount; if(!seen[k]){ seen[k] = 1; sum += Number(g.amount) || 0; } }); });
      h += '<div class="sum">' + (m.acts.length === 1 ? t('nActions1') : t('nActions', {n: m.acts.length})) + ' · ' + t('fromThese', {amt: usd(sum)}) + '</div>' + m.acts.map(actHtml).join('');
    } else {
      var k = o.status === 'former' ? 'former' : o.reason ? o.reason : o.reviewed ? 'none' : 'current';
      h += '<p class="status' + (k === 'none' ? ' none' : '') + '">' + t(k) + '</p>';
    }
    return h + '</div>';
  }

  function render(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang') === LANG); });
    var q = document.getElementById('q'); q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
    document.getElementById('how').innerHTML = '<p>' + esc(t('how1')) + '</p><p>' + t('how2') + '</p>';
    document.getElementById('foot').innerHTML = t('foot');
    if(!DATA) return;
    var P = build();
    var nActs = (DATA.actions || []).length, withActs = 0;
    P.forEach(function(p){ p.members.forEach(function(m){ if(m.acts.length) withActs++; }); });
    document.getElementById('stats').innerHTML =
      '<div><b>' + nActs + '</b>' + t('sActions') + '</div><div><b>' + withActs + '</b>' + t('sMembers') + '</div>' +
      '<div><b>' + P.length + '</b>' + t('sCities') + '</div>' + (DATA.updated ? '<div><b>' + esc(day(DATA.updated)) + '</b>' + t('sUpdated') + '</div>' : '');
    document.getElementById('chips').innerHTML = P.map(function(p){
      var n = p.members.reduce(function(s, m){ return s + m.acts.length; }, 0);
      return '<a class="chip' + (n ? '' : ' zero') + '" href="#' + p.key + '">' + esc(p.name) + '<span class="n">' + n + '</span></a>';
    }).join('');
    document.getElementById('list').innerHTML = P.map(function(p){
      var cur = p.members.filter(function(m){ return m.o.status !== 'former'; });
      // members with actions first, then the rest in list order
      var ms = p.members.slice().sort(function(a, b){ return (b.acts.length > 0) - (a.acts.length > 0) || b.acts.length - a.acts.length; });
      return '<section class="city" id="' + p.key + '"><h2>' + esc(p.name) + '</h2>' + (p.body && p.body !== p.name ? '<div class="body">' + esc(p.body) + '</div>' : '') +
        (cur.length || p.members.length ? ms.map(memberHtml).join('') : '<p class="status">' + t('noIncumbent') + '</p>') + '</section>';
    }).join('');
    filter();
    if(location.hash && !render.jumped){ render.jumped = true; var el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
  }
  function filter(){
    var q = norm(document.getElementById('q').value).trim(), any = false;
    document.querySelectorAll('.city').forEach(function(c){
      var cityHit = !q || norm(c.querySelector('h2').textContent).indexOf(q) >= 0, shown = 0;
      c.querySelectorAll('.member').forEach(function(m){
        var hit = cityHit || m.getAttribute('data-search').indexOf(q) >= 0;
        m.hidden = !hit; if(hit) shown++;
      });
      var noMembers = !c.querySelector('.member');
      c.hidden = !(cityHit || shown); if(!c.hidden) any = true;
      if(noMembers && q && !cityHit) c.hidden = true;
    });
    document.getElementById('noresult').hidden = any || !DATA;
  }

  document.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click', function(){ LANG = b.getAttribute('data-lang'); try { localStorage.setItem('ballot305.lang', LANG); } catch(e){} render(); });
  });
  document.getElementById('q').addEventListener('input', filter);
  render();
  fetch('/data/donor-actions.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ DATA = j; render(); })
    .catch(function(){ document.getElementById('list').innerHTML = '<p class="empty">' + esc(t('loadErr')) + '</p>'; });
})();
</script>
</body>
</html>
