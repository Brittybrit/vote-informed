<style>
  :root{
    --paper:#FAFAF7; --ink:#131F3C; --ink-soft:#3D4763; --rule:#131F3C; --hair:#C9C9C1;
    --left-fg:#1D4ED8; --flag-bg:#FDF1D8; --flag-fg:#8A5A0B; --ok-bg:#E6F0E8; --ok-fg:#2F6B3C; --no-fg:#9B2C1F;
    --sans:'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55;}
  header{border-bottom:4px solid var(--rule); padding:18px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;}
  header a{color:var(--ink); text-decoration:none; font-weight:900; text-transform:uppercase; letter-spacing:.01em; font-size:20px;}
  .langs{display:flex; gap:6px;}
  .langs button{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; background:transparent; border:1.5px solid var(--rule); color:var(--ink); padding:5px 10px; cursor:pointer;}
  .langs button.on{background:var(--ink); color:var(--paper);}
  main{max-width:760px; margin:0 auto; padding:28px 16px 64px;}
  h1{font-weight:900; text-transform:uppercase; font-size:30px; line-height:1.1; margin-bottom:10px;}
  .lede{color:var(--ink-soft); margin-bottom:14px;}
  .stats{display:flex; flex-wrap:wrap; gap:8px 22px; font-family:var(--mono); font-size:12.5px; margin:16px 0 18px; padding:10px 0; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);}
  .stats b{font-family:var(--sans); font-size:20px; font-weight:900; display:block; line-height:1.1;}
  .tools{position:sticky; top:0; background:var(--paper); z-index:2; padding:10px 0 8px; border-bottom:2px solid var(--rule);}
  .tools input{width:100%; font:inherit; font-size:15px; padding:9px 11px; border:1.5px solid var(--rule); background:#fff; color:var(--ink); border-radius:0;}
  .chips{display:flex; flex-wrap:nowrap; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;}
  .chip{font-family:var(--mono); font-size:11.5px; border:1.5px solid var(--ink); padding:2px 8px; color:var(--ink); text-decoration:none; background:transparent; white-space:nowrap;}
  .chip .n{font-weight:600; margin-left:4px;}
  .chip.zero{border-color:var(--hair); color:var(--ink-soft);}
  .city{margin-top:30px; scroll-margin-top:118px;}
  .city h2{font-weight:900; text-transform:uppercase; font-size:21px; line-height:1.15; padding-top:12px; border-top:4px solid var(--rule);}
  .city .body{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin:2px 0 8px;}
  .member{margin-top:16px;}
  .member h3{font-size:17px; font-weight:800; line-height:1.3;}
  .member .sum{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .status{font-size:14px; line-height:1.5; margin:6px 0 0; padding:7px 10px; border-left:4px solid var(--hair); color:var(--ink-soft);}
  .status.none{border-left-color:var(--ok-fg);}
  .act{padding:12px 0 14px; border-bottom:1px dotted var(--hair);}
  .act:last-child{border-bottom:none;}
  .when{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .ttl{font-weight:700; font-size:15px; line-height:1.4; margin-top:3px;}
  .vote{font-size:13.5px; margin-top:5px; line-height:1.5;}
  .vote .split{color:var(--no-fg); font-weight:700;}
  .roles{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .role{font-family:var(--mono); font-size:11px; border:1.5px solid var(--ink); padding:1px 6px;}
  .role.no{border-color:var(--no-fg); color:var(--no-fg);}
  .donor{font-size:14px; margin-top:8px; padding-left:10px; border-left:3px solid var(--rule);}
  .donor b{font-weight:600;}
  .ctx{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.45;}
  .links{font-family:var(--mono); font-size:11.5px; margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 14px;}
  a{color:var(--left-fg);}
  .empty{color:var(--ink-soft); font-size:14px; margin-top:6px;}
  .noresult{margin-top:24px; color:var(--ink-soft);}
  .how{margin-top:40px; padding-top:14px; border-top:2px solid var(--rule); font-size:14px; color:var(--ink-soft);}
  .how p{margin-bottom:10px;}
  footer{border-top:2px solid var(--rule); padding:18px 16px; font-size:14px; color:var(--ink-soft); text-align:center;}
  [hidden]{display:none !important;}
</style>

    },
    ht: {

      lede: 'Sa ofisyèl vil Miami-Dade ki sou bilten vòt 3 novanm 2026 la te fè sou dosye ki nonmen youn nan pwòp donatè kanpay yo: vòt, mosyon, dosye yo te pote, ak vòt yo te rate. Nou verifye chak dosye ak men nan pwosè-vèbal reyinyon an oswa rezolisyon ki siyen an. Nou mete si yo bay anvan oswa apre yon aksyon, nou pa jije. Anyen isit la pa di yo te achte yon vòt.',

      noIncumbent: 'Pa gen okenn manm aktyèl òganis sa a ki sou bilten vòt la, kidonk pa gen aksyon ofisyèl pou konpare.',
      nActions: '{n} aksyon ki nonmen yon donatè', nActions1: '1 aksyon ki nonmen yon donatè', fromThese: 'don donatè sa yo: {amt}',
      current: 'Poko revize.', none: 'Revize. Nou pa jwenn okenn aksyon ofisyèl sou dosye ki nonmen youn nan donatè li yo nan dosye nou chèche yo.',
      nodata: 'Poko gen rapò kanpay detaye pou li, kidonk nou poko ka konpare donatè li yo ak aksyon li yo.',
      nogivers: 'Rapò kanpay li yo pa gen okenn donatè deyò, kidonk pa gen okenn aksyon ki ka mare ak youn.',
      former: 'Ansyen manm. Nou poko revize ansyen aksyon ofisyèl li yo.',
      passed: 'Pase', failed: 'Pa pase', unan: 'alinanimite', consent: 'apwouve nan ajanda konsantman an', yes: 'Wi', no: 'Non', absent: 'Absan',
      gave: 'bay {amt} {date}', record: 'Dosye reyinyon an', report: 'Rapò kanpay',
      'role.yes': 'Vote wi', 'role.no': 'Vote non', 'role.absent': 'Te absan pou vòt la', 'role.moved': 'Te pwopoze mosyon an', 'role.seconded': 'Te apiye mosyon an', 'role.presented': 'Te prezante dosye a',
      how1: 'Kijan nou fè lis sa a: pou chak ofisyèl, nou chèche non donatè biznis, PAC ak pi gwo donatè endividyèl ki nan rapò kanpay ofisyèl yo nan ajanda, pwosè-vèbal ak rezolisyon vil la pibliye depi janvye 2025. Lè donatè a se yon konpayi sè pati ki nan dosye a, nou mete l sèlman si dosye konpayi Leta a montre menm adrès ak menm manadjè oswa ajan anrejistre, epi dosye a di sa ki konfime. Dosye ki sou entènèt yo pa menm nan chak vil, kidonk “nou pa jwenn” vle di nou pa jwenn anyen nan dosye nou chèche yo.',
      how2: 'Paj chak kandida montre tou donatè ki bay plis pase yon kandida nan menm vil la. Li <a href="/methodology#ties">tout metòd la</a>. Ou jwenn yon erè oswa yon bagay ki manke? Ekri <a href="mailto:corrections@ballot305.org">corrections@ballot305.org</a>.',
      foot: '<a href="/">Retounen sou Ballot305.org</a> · <a href="/methodology">Kijan li mache</a> · <a href="/about">Konsènan</a>'
    }
  };
  // Display names for the bodies the data lists. Cities on the ballot with no incumbent running are filled in from data.checked.
  var SUFFIX = /\s+(City Council|City Commission|Village Council|Village Commission|Town Council)$/;
  var NAMES = {'opa-?\\s*locka': 'Opa-locka'};
  var LANG = 'en', DATA = null;
  try { var s0 = localStorage.getItem('ballot305.lang'); if (S[s0]) LANG = s0; } catch(e){}

  function t(k, v){ var s = (S[LANG][k] != null ? S[LANG][k] : S.en[k]) || ''; return v ? s.replace(/\{(\w+)\}/g, function(_, n){ return v[n] != null ? v[n] : ''; }) : s; }
  function esc(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function L(x){ return x && typeof x === 'object' ? (x[LANG] || x.en || '') : (x || ''); }
  function usd(n){ return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
  function day(d){ var m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ''; try { return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(LANG === 'ht' ? 'fr' : LANG, {month:'short', day:'numeric', year:'numeric'}); } catch(e){ return d; } }
  function link(u, txt){ return /^https:\/\//.test(u || '') ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(txt) + ' ↗</a>' : ''; }
  function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function titleCase(s){ return s.replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); }
  function sameCand(a, b){
    var x = norm(String(a).replace(/["“”][^"“”]*["“”]/g, ' ')).replace(/[^a-z0-9]+/g, ' ').trim().split(' '), y = norm(b).replace(/[^a-z0-9]+/g, ' ').trim().split(' ');
    return x[x.length-1] === y[y.length-1] && x[0].charAt(0) === y[0].charAt(0);
  }

  function build(){
    var d = DATA, places = {};
    function place(name, body){
      var k = slug(name);
      if(!places[k]) places[k] = {key: k, name: name, body: body || '', members: []};
      if(body && !places[k].body) places[k].body = body;
      return places[k];
    }
    (d.officeholders || []).forEach(function(o){
      var name = o.body === 'Miami-Dade County Commission' ? 'Miami-Dade County, District 5' : String(o.body).replace(SUFFIX, '');
      var p = place(name, o.body);
      var acts = (d.actions || []).filter(function(a){ return a.body === o.body && sameCand(o.candidate, a.candidate); })
        .sort(function(a, b){ return String(b.date).localeCompare(String(a.date)); });
      p.members.push({o: o, acts: acts});
    });
    // cities on the ballot with no incumbent in the list
    (d.checked || []).forEach(function(re){
      var m = String(re).match(/\(([^)]*\|[^)]*)\)/);
      if(!m) return;
      m[1].split('|').forEach(function(c){
        var name = NAMES[c] || titleCase(c.replace(/\\s\*|\?/g, ''));
        if(!places[slug(name)]) place(name, '');
      });
    });
    return Object.keys(places).map(function(k){ return places[k]; }).sort(function(a, b){
      var ca = /County/.test(a.name), cb = /County/.test(b.name);
      return ca !== cb ? (ca ? -1 : 1) : a.name.localeCompare(b.name);
    });
  }

  function actHtml(a){
    var v = a.votes || {}, out = [];
    var split = v.yes && v.no && v.no.length;
    out.push('<strong>' + t(a.passed ? 'passed' : 'failed') + '</strong>' + (split ? ' <span class="split">' + v.yes.length + '-' + v.no.length + '</span>' : '') +
      (v.unanimous ? ', ' + t('unan') : '') + (v.consent ? ', ' + t('consent') : ''));
    if(split) out.push(t('yes') + ': ' + esc(v.yes.join(', ')) + ' · ' + t('no') + ': ' + esc(v.no.join(', ')));
    if(v.absent && v.absent.length) out.push(t('absent') + ': ' + esc(v.absent.join(', ')));
    var donors = (a.donors || []).map(function(g){ return '<div class="donor"><b>' + esc(L(g.name)) + '</b> ' + t('gave', {amt: usd(g.amount), date: day(g.date)}) + '</div>'; }).join('');
    var ctx = L(a.context);
    return '<div class="act"><div class="when">' + esc(day(a.date)) + '</div><div class="ttl">' + esc(L(a.title)) + '</div>' +
      '<div class="vote">' + out.join('<br>') + '</div>' +
      '<div class="roles">' + (a.role || []).map(function(r){ return '<span class="role' + (r === 'no' ? ' no' : '') + '">' + t('role.' + r) + '</span>'; }).join('') + '</div>' +
      donors + (ctx ? '<p class="ctx">' + esc(ctx) + '</p>' : '') +
      '<div class="links">' + link(a.url, t('record')) + link(a.donorUrl, t('report')) + '</div></div>';
  }
  function memberHtml(m){
    var o = m.o, h = '<div class="member" data-search="' + esc(norm([o.candidate].concat(m.acts.map(function(a){
      return [L(a.title)].concat((a.donors || []).map(function(g){ return L(g.name); })).join(' ');
    })).join(' '))) + '"><h3>' + esc(o.candidate) + '</h3>';
    if(m.acts.length){
      var seen = {}, sum = 0;
      m.acts.forEach(function(a){ (a.donors || []).forEach(function(g){ var k = norm(L(g.name)) + '|' + g.date + '|' + g.amount; if(!seen[k]){ seen[k] = 1; sum += Number(g.amount) || 0; } }); });
      h += '<div class="sum">' + (m.acts.length === 1 ? t('nActions1') : t('nActions', {n: m.acts.length})) + ' · ' + t('fromThese', {amt: usd(sum)}) + '</div>' + m.acts.map(actHtml).join('');
    } else {
      var k = o.status === 'former' ? 'former' : o.reason ? o.reason : o.reviewed ? 'none' : 'current';
      h += '<p class="status' + (k === 'none' ? ' none' : '') + '">' + t(k) + '</p>';
    }
    return h + '</div>';
  }

  function render(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang') === LANG); });
    var q = document.getElementById('q'); q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
    document.getElementById('how').innerHTML = '<p>' + esc(t('how1')) + '</p><p>' + t('how2') + '</p>';
    document.getElementById('foot').innerHTML = t('foot');
    if(!DATA) return;
    var P = build();
    var nActs = (DATA.actions || []).length, withActs = 0;
    P.forEach(function(p){ p.members.forEach(function(m){ if(m.acts.length) withActs++; }); });
    document.getElementById('stats').innerHTML =
      '<div><b>' + nActs + '</b>' + t('sActions') + '</div><div><b>' + withActs + '</b>' + t('sMembers') + '</div>' +
      '<div><b>' + P.length + '</b>' + t('sCities') + '</div>' + (DATA.updated ? '<div><b>' + esc(day(DATA.updated)) + '</b>' + t('sUpdated') + '</div>' : '');
    document.getElementById('chips').innerHTML = P.map(function(p){
      var n = p.members.reduce(function(s, m){ return s + m.acts.length; }, 0);
      return '<a class="chip' + (n ? '' : ' zero') + '" href="#' + p.key + '">' + esc(p.name) + '<span class="n">' + n + '</span></a>';
    }).join('');
    document.getElementById('list').innerHTML = P.map(function(p){
      var cur = p.members.filter(function(m){ return m.o.status !== 'former'; });
      // members with actions first, then the rest in list order
      var ms = p.members.slice().sort(function(a, b){ return (b.acts.length > 0) - (a.acts.length > 0) || b.acts.length - a.acts.length; });
      return '<section class="city" id="' + p.key + '"><h2>' + esc(p.name) + '</h2>' + (p.body && p.body !== p.name ? '<div class="body">' + esc(p.body) + '</div>' : '') +
        (cur.length || p.members.length ? ms.map(memberHtml).join('') : '<p class="status">' + t('noIncumbent') + '</p>') + '</section>';
    }).join('');
    filter();
    if(location.hash && !render.jumped){ render.jumped = true; var el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
  }
  function filter(){
    var q = norm(document.getElementById('q').value).trim(), any = false;
    document.querySelectorAll('.city').forEach(function(c){
      var cityHit = !q || norm(c.querySelector('h2').textContent).indexOf(q) >= 0, shown = 0;
      c.querySelectorAll('.member').forEach(function(m){
        var hit = cityHit || m.getAttribute('data-search').indexOf(q) >= 0;
        m.hidden = !hit; if(hit) shown++;
      });
      var noMembers = !c.querySelector('.member');
      c.hidden = !(cityHit || shown); if(!c.hidden) any = true;
      if(noMembers && q && !cityHit) c.hidden = true;
    });
    document.getElementById('noresult').hidden = any || !DATA;
  }

  document.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click', function(){ LANG = b.getAttribute('data-lang'); try { localStorage.setItem('ballot305.lang', LANG); } catch(e){} render(); });
  });
  document.getElementById('q').addEventListener('input', filter);
  render();
  fetch('/data/donor-actions.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ DATA = j; render(); })
    .catch(function(){ document.getElementById('list').innerHTML = '<p class="empty">' + esc(t('loadErr')) + '</p>'; });
})();
</script>
</body>
</html>
