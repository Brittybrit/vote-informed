name: Deploy
# Manual deploy to Cloudflare from any device: GitHub -> Actions -> Deploy -> Run workflow.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare Workers" template)
# and CLOUDFLARE_ACCOUNT_ID. Forks without these secrets can't deploy.
on:
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Brittybrit/vote-informed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/worker.js
      - run: npm test
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
