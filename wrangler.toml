name = "ballot-intel"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

routes = [
  { pattern = "ballot305.org", custom_domain = true },
  { pattern = "www.ballot305.org", custom_domain = true }
]

[assets]
directory = "./public"
# Lets the Worker read the bundled master ballot (trusted measure summaries).
binding = "ASSETS"

# Forks: create your own namespace with `npx wrangler kv namespace create CACHE`
# and replace the id below. Also replace or delete the routes above.
[[kv_namespaces]]
binding = "CACHE"
id = "2a7520dcd23f421eaecb6bdfb98ef282"

# Background research runs in a Durable Object alarm (15-minute limit) instead of ctx.waitUntil (~30s).
[[durable_objects.bindings]]
name = "RESEARCH"
class_name = "ResearchRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResearchRunner"]

# ---------------------------------------------------------------------------
# Ballot317: Marion County, Indiana. A separate Worker from the same code.
#   npx wrangler deploy --env indy
# Plain `npx wrangler deploy` is Ballot305 and ignores everything below.
# Nothing here is shared with Ballot305: own Worker name, own pages folder,
# own cache, own background runner, no custom domain (workers.dev only).
[env.indy]
name = "ballot317"
workers_dev = true
routes = []   # never inherit ballot305.org

[env.indy.vars]
COUNTY = "marion"

[env.indy.assets]
directory = "./public-317"
binding = "ASSETS"

# Create once: npx wrangler kv namespace create CACHE --env indy
# then paste the printed id here.
[[env.indy.kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_BALLOT317_KV_ID"

[[env.indy.durable_objects.bindings]]
name = "RESEARCH"
class_name = "ResearchRunner"
