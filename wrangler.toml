name = "ballot-intel"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

routes = [
  { pattern = "ballot305.org", custom_domain = true },
  { pattern = "www.ballot305.org", custom_domain = true }
]

[assets]
directory = "./public"

# Forks: create your own namespace with `npx wrangler kv namespace create CACHE`
# and replace the id below. Also replace or delete the routes above.
[[kv_namespaces]]
binding = "CACHE"
id = "2a7520dcd23f421eaecb6bdfb98ef282"

# Background research runs in a Durable Object alarm (15-minute limit) instead of ctx.waitUntil (~30s).
[[durable_objects.bindings]]
name = "RESEARCH"
class_name = "ResearchRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResearchRunner"]
